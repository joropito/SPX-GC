<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <title>Apnea - Session Overview</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Scripts Principales -->
    <script type="text/javascript" src="js/lib/anime.min.js"></script>
    <script type="text/javascript" src="js/spx_interface.js"></script>
    <script type="text/javascript" src="js/apnea-helpers.js"></script>
    
    <!-- Estilos y Tema Dinámico -->
    <link rel="stylesheet" type="text/css" href="css/styles.css" />
    <link rel="stylesheet" type="text/css" href="css/flag-icon.css" />
    <link rel="stylesheet" type="text/css" id="DynamicTheme" href="themes/Apnea_Broadcast.css" />

    <style>
        .SPXWindow {
            position: absolute;
            width: 100vw;
            height: 100vh;
            top: 0;
            left: 0;
            pointer-events: none;
            overflow: hidden;
        }

        #gfx {
            position: absolute;
            opacity: 0; /* Animado por Anime.js */
            box-sizing: border-box;
            z-index: 10;
            display: flex;
            flex-direction: column;
            transform-origin: center center;
            will-change: transform, opacity, clip-path;
        }

        /* Ocultar columna de notas y restar automáticamente ese espacio */
        #gfx.hide-notes .head-notes,
        #gfx.hide-notes .apnea-col-notes {
            display: none !important;
            width: 0 !important;
            max-width: 0 !important;
            padding: 0 !important;
            margin: 0 !important;
            flex: 0 0 0 !important;
        }

        /* Alineación vertical perfecta y simétrica en todas las filas */
        .apnea-row,
        .apnea-table-head {
            display: flex !important;
            flex-direction: row !important;
            align-items: center !important;
        }

        .apnea-col-ot,
        .apnea-col-lane,
        .apnea-col-country,
        .apnea-col-athlete,
        .apnea-col-ap,
        .apnea-col-rp,
        .apnea-col-discipline,
        .apnea-col-notes,
        .head-ot,
        .head-lane,
        .head-country,
        .head-athlete,
        .head-ap,
        .head-rp,
        .head-discipline,
        .head-notes {
            display: inline-flex !important;
            align-items: center !important;
            line-height: 1 !important;
            transform: translateY(0.06vw) !important;
        }

        .apnea-col-flag,
        .head-flag,
        .apnea-col-card,
        .head-card {
            display: inline-flex !important;
            align-items: center !important;
            justify-content: center !important;
            line-height: 1 !important;
        }

        .flag-icon {
            display: block !important;
            height: 0.85em !important;
            width: 1.25em !important;
            background-size: cover !important;
            background-position: center center !important;
            border-radius: 2px !important;
            line-height: 1 !important;
            vertical-align: middle !important;
            margin: 0 !important;
        }

        .flag-icon:before {
            content: "" !important;
        }
    </style>

    <script>
        // Helper local seguro para elementos DOM
        function e(elementID) {
            if (!elementID) return null;
            return document.getElementById(elementID);
        }

        // Parsear timestamps
        function parseTimestampMs(str, sessionDate) {
            if (!str) return 0;
            if (typeof str === 'number') return str;
            if (typeof str === 'string') {
                const parsed = Date.parse(str);
                if (!isNaN(parsed) && parsed > 0) return parsed;

                const timeMatch = str.match(/^(\d{1,2}):(\d{2})(?::(\d{2}))?$/);
                if (timeMatch) {
                    const d = sessionDate ? new Date(sessionDate) : new Date();
                    d.setHours(parseInt(timeMatch[1], 10), parseInt(timeMatch[2], 10), parseInt(timeMatch[3] || '0', 10), 0);
                    return d.getTime();
                }
            }
            return 0;
        }

        // Estado global del Template
        let appState = {
            attempts: [],
            athletes: [],
            sessions: [],
            heats: [],
            competition: {},
            active_broadcast: {}
        };

        let isOverlayVisible = false;
        let eventSource = null;
        let clockOffset = 0;
        let liveTickerTimer = null;
        let paginationInterval = null;

        let currentPageIndex = 0;
        let totalPages = 1;
        let currentSessionAttempts = [];
        let itemsPerPage = 12;
        let pageDurationMs = 7000;
        let isTransitioningPage = false;
        // localAttemptStartMap es provisto por apnea-helpers.js (ventana global)

        // Configuración de visualización desde campos SPX
        function getItemsPerPageConfig() {
            const val = e('_ITEMS_PER_PAGE') ? parseInt(e('_ITEMS_PER_PAGE').innerText.trim(), 10) : 12;
            return (!isNaN(val) && val > 0) ? val : 12;
        }

        function getPageDurationConfig() {
            const val = e('_PAGE_DURATION') ? parseFloat(e('_PAGE_DURATION').innerText.trim()) : 7;
            const sec = (!isNaN(val) && val > 0) ? val : 7;
            return Math.round(sec * 1000);
        }

        // Aplicar Posición y Tamaño al Recuadro desde Configuración SPX
        function applyLayoutConfig() {
            const gfx = e('gfx');
            if (!gfx) return;

            // 1. Posición
            let positionClass = 'pos-bottom-left';
            const spxPos = e('_POSITION') ? e('_POSITION').innerText.trim().toLowerCase() : '';
            let urlPos = '';
            try {
                const urlParams = new URLSearchParams(window.location.search);
                urlPos = (urlParams.get('pos') || urlParams.get('position') || '').toLowerCase();
            } catch (_) {}
            const targetPos = spxPos || urlPos;

            if (targetPos) {
                if (targetPos.includes('center-center') || targetPos === 'pos-center-center') positionClass = 'pos-center-center';
                else if (targetPos.includes('bottom-right')) positionClass = 'pos-bottom-right';
                else if (targetPos.includes('top-left')) positionClass = 'pos-top-left';
                else if (targetPos.includes('top-right')) positionClass = 'pos-top-right';
                else if (targetPos.includes('center-left')) positionClass = 'pos-center-left';
                else if (targetPos.includes('center-right')) positionClass = 'pos-center-right';
                else if (targetPos.includes('bottom-center')) positionClass = 'pos-bottom-center';
                else positionClass = 'pos-bottom-left';
            }

            // 2. Tamaño
            let sizeClass = 'size-wide';
            const spxSize = e('_SIZE') ? e('_SIZE').innerText.trim().toLowerCase() : '';
            let urlSize = '';
            try {
                const urlParams = new URLSearchParams(window.location.search);
                urlSize = (urlParams.get('size') || '').toLowerCase();
            } catch (_) {}
            const targetSize = spxSize || urlSize;

            if (targetSize) {
                if (targetSize.includes('compact')) sizeClass = 'size-compact';
                else if (targetSize.includes('standard')) sizeClass = 'size-standard';
                else if (targetSize.includes('wide')) sizeClass = 'size-wide';
                else if (targetSize.includes('full')) sizeClass = 'size-full';
            }

            // 3. Mostrar / Ocultar Notas
            const spxNotes = e('_SHOW_NOTES') ? e('_SHOW_NOTES').innerText.trim().toLowerCase() : '';
            let urlNotes = '';
            try {
                const urlParams = new URLSearchParams(window.location.search);
                urlNotes = (urlParams.get('notes') || urlParams.get('shownotes') || '').toLowerCase();
            } catch (_) {}
            const targetNotes = spxNotes || urlNotes;
            const hideNotesClass = (targetNotes === 'false' || targetNotes === '0' || targetNotes === 'hide' || targetNotes === 'no') ? 'hide-notes' : '';

            // Resetear clases y aplicar
            gfx.className = `apnea-panel session-table ${positionClass} ${sizeClass} ${hideNotesClass}`.trim();
            itemsPerPage = getItemsPerPageConfig();
            pageDurationMs = getPageDurationConfig();
        }

        // Cargar datos iniciales completos vía API REST
        async function loadInitialData() {
            try {
                const apiBase = getApiBaseUrl();
                const res = await fetch(`${apiBase}/api/all`, { cache: 'no-store' });
                if (!res.ok) throw new Error(`HTTP Error ${res.status}`);
                const data = await res.json();

                clockOffset = Date.now() - (data.server_now || Date.now());
                appState = data;

                syncSessionData();
            } catch (err) {
                console.error("Error al cargar datos iniciales:", err);
                setTimeout(loadInitialData, 3000);
            }
        }

        // Configurar conexión SSE en tiempo real
        function setupLiveUpdates() {
            if (eventSource) {
                try { eventSource.close(); } catch (_) {}
                eventSource = null;
            }

            const apiBase = getApiBaseUrl();
            try {
                eventSource = new EventSource(`${apiBase}/api/events`);

                eventSource.onopen = () => {
                    loadInitialData();
                };

                eventSource.onmessage = async (e) => {
                    if (e.data === 'update' || !e.data || e.data === 'connected') {
                        try {
                            const res = await fetch(`${apiBase}/api/all`, { cache: 'no-store' });
                            if (res.ok) {
                                const data = await res.json();
                                clockOffset = Date.now() - (data.server_now || Date.now());
                                appState = data;
                                syncSessionData();
                            }
                        } catch (err) {
                            console.error("Error actualizando estado por SSE:", err);
                        }
                    }
                };

                eventSource.onerror = () => {
                    console.warn("SSE reconectando...");
                };
            } catch (err) {
                console.error("Error conectando SSE:", err);
            }
        }

        // Obtener información de la Sesión Activa e intentos correspondientes
        function getActiveSessionInfo() {
            if (!appState || (!appState.sessions && !appState.heats) || !appState.attempts) return null;

            const activeBroadcast = appState.active_broadcast || {};
            let activeSessionId = activeBroadcast.session_id || "";

            const sessionsList = appState.sessions || appState.heats || [];
            let activeSession = sessionsList.find(s => (s.session_id === activeSessionId || s.heat_id === activeSessionId));

            if (!activeSession && sessionsList.length > 0) {
                activeSession = sessionsList.find(s => s.status !== 'closed') || sessionsList[0];
                activeSessionId = activeSession.session_id || activeSession.heat_id;
            }

            if (!activeSession) return null;

            const sessionAttempts = (appState.attempts || []).filter(att => 
                att.session_id === activeSessionId || att.heat_id === activeSessionId
            );

            // Ordenar intentos cronológicamente por OT y luego por carril (lane)
            sessionAttempts.sort((a, b) => {
                const otA = (a.attemp_ot || '').trim();
                const otB = (b.attemp_ot || '').trim();
                if (otA !== otB) return otA.localeCompare(otB);
                return parseInt(a.attemp_lane || 0, 10) - parseInt(b.attemp_lane || 0, 10);
            });

            return {
                session: activeSession,
                sessionId: activeSessionId,
                sessionName: activeSession.session_name || activeSession.name || 'SESIÓN ACTIVA',
                sessionDate: activeSession.session_date,
                discipline: (activeSession.session_discipline || activeSession.discipline || "STA").toUpperCase(),
                attempts: sessionAttempts
            };
        }

        let pageSlices = [];

        // Calcular distribución equilibrada agrupando por heats (OT) completos
        function calculateOtAwarePageSlices(attempts, maxPerPage) {
            if (!attempts || attempts.length === 0) return [];
            if (attempts.length <= maxPerPage) {
                return [{ start: 0, end: attempts.length, count: attempts.length }];
            }

            // 1. Agrupar intentos contiguos con el mismo OT (Heat)
            const otGroups = [];
            let currentOt = null;
            let curGroupIndices = [];

            attempts.forEach((att, idx) => {
                const ot = (att.attemp_ot || '').trim();
                if (ot !== currentOt && currentOt !== null) {
                    otGroups.push({ ot: currentOt, start: curGroupIndices[0], end: idx, count: curGroupIndices.length });
                    currentOt = ot;
                    curGroupIndices = [idx];
                } else {
                    if (currentOt === null) currentOt = ot;
                    curGroupIndices.push(idx);
                }
            });
            if (curGroupIndices.length > 0) {
                otGroups.push({ ot: currentOt, start: curGroupIndices[0], end: attempts.length, count: curGroupIndices.length });
            }

            if (otGroups.length <= 1) {
                return [{ start: 0, end: attempts.length, count: attempts.length }];
            }

            // 2. Empaquetamiento greedy respetando que ningún OT quede cortado
            let greedyPages = [];
            let gList = [];
            let gCount = 0;
            for (const g of otGroups) {
                if (gCount + g.count > maxPerPage && gList.length > 0) {
                    greedyPages.push(gList);
                    gList = [g];
                    gCount = g.count;
                } else {
                    gList.push(g);
                    gCount += g.count;
                }
            }
            if (gList.length > 0) greedyPages.push(gList);

            const numPages = greedyPages.length;
            if (numPages <= 1) {
                return [{ start: 0, end: attempts.length, count: attempts.length }];
            }

            // 3. Distribución equilibrada proporcional de heats entre páginas
            const totalHeats = otGroups.length;
            let baseHeats = Math.floor(totalHeats / numPages);
            let remainderHeats = totalHeats % numPages;

            let canUseHeatsDistribution = true;
            let heatIndex = 0;
            for (let p = 0; p < numPages; p++) {
                let countHeats = baseHeats + (p < remainderHeats ? 1 : 0);
                let itemsInPage = 0;
                for (let h = 0; h < countHeats; h++) {
                    if (heatIndex + h < totalHeats) {
                        itemsInPage += otGroups[heatIndex + h].count;
                    }
                }
                if (itemsInPage > maxPerPage && countHeats > 1) {
                    canUseHeatsDistribution = false;
                    break;
                }
                heatIndex += countHeats;
            }

            let finalGroupSlices = [];
            if (canUseHeatsDistribution) {
                let hIdx = 0;
                for (let p = 0; p < numPages; p++) {
                    let countHeats = baseHeats + (p < remainderHeats ? 1 : 0);
                    let pageGroupSlice = [];
                    for (let h = 0; h < countHeats; h++) {
                        if (hIdx < totalHeats) {
                            pageGroupSlice.push(otGroups[hIdx]);
                            hIdx++;
                        }
                    }
                    if (pageGroupSlice.length > 0) {
                        finalGroupSlices.push(pageGroupSlice);
                    }
                }
            } else {
                finalGroupSlices = greedyPages;
            }

            return finalGroupSlices.map(groupSlice => {
                const first = groupSlice[0];
                const last = groupSlice[groupSlice.length - 1];
                return {
                    start: first.start,
                    end: last.end,
                    count: last.end - first.start
                };
            });
        }

        // Sincronizar datos y páginas de la sesión
        function syncSessionData() {
            const sessionInfo = getActiveSessionInfo();
            if (!sessionInfo) return;

            currentSessionAttempts = sessionInfo.attempts;
            itemsPerPage = getItemsPerPageConfig();
            pageSlices = calculateOtAwarePageSlices(currentSessionAttempts, itemsPerPage);
            totalPages = Math.max(1, pageSlices.length);

            if (currentPageIndex >= totalPages) {
                currentPageIndex = 0;
            }

            // Actualizar título de la sesión activa
            if (e('sessionTitle')) e('sessionTitle').innerText = sessionInfo.sessionName;

            // Renderizar la página actual si no está en medio de una transición
            if (!isTransitioningPage) {
                renderPageRows(currentPageIndex);
            }
        }

        let lockedContainerHeight = 0;

        // Renderizar las filas de una página específica
        function renderPageRows(pageIdx) {
            const container = e('lanesContainer');
            if (!container) return;

            const sessionInfo = getActiveSessionInfo();
            if (!sessionInfo) {
                container.innerHTML = '<div class="empty-heat-msg">No hay sesión activa disponible</div>';
                return;
            }

            const athletesList = appState.athletes || [];
            const isDynamic = ['DYN', 'DYNB', 'DNF'].includes(sessionInfo.discipline);
            const nowMs = Date.now() - clockOffset;

            const slice = pageSlices[pageIdx] || { start: 0, end: currentSessionAttempts.length, count: currentSessionAttempts.length };
            const pageAttempts = currentSessionAttempts.slice(slice.start, slice.end);

            if (pageAttempts.length === 0) {
                container.innerHTML = '<div class="empty-heat-msg">No hay intentos registrados en esta sesión</div>';
                return;
            }

            let html = '';
            pageAttempts.forEach(att => {
                const lane = att.attemp_lane || '-';
                const ot = att.attemp_ot || '-';
                const athlete = athletesList.find(a => a.athlete_id === att.athlete_id) || {};
                const name = athlete.athlete_name || att.athlete_name || 'Atleta';
                const country = (athlete.athlete_country || att.athlete_country || '').toUpperCase();
                const flagClass = country ? `flag-icon flag-icon-${country.toLowerCase()}` : '';
                const attDiscipline = (att.attemp_discipline || sessionInfo.discipline || '').toUpperCase();

                const isJudged = att.attemp_status === 'JUDGED' || att.attemp_status === 'DQ' || Boolean(att.attemp_card) || att.attemp_status === 'DNS';
                const isPerforming = att.attemp_status === 'PERFORMING';
                const cardInfo = getAttemptCardAndNotes(att, isJudged, nowMs, appState.competition, clockOffset);
                // En SESSION_OVERVIEW solo mostrar notas si el intento ya fue juzgado
                const noteHtml = isJudged ? cardInfo.noteHtml : '';

                // Resultado AP
                const apFormatted = formatMetric(att.attemp_ap, attDiscipline || sessionInfo.discipline);

                // Resultado RP: Solo mostrar RP real oficial (juzgados, DQ o DNS)
                let rpFormatted = '-';
                if (isJudged) {
                    if (att.attemp_card === 'red' || att.attemp_status === 'DQ') rpFormatted = 'DQ';
                    else if (att.attemp_card === 'dns' || att.attemp_status === 'DNS') rpFormatted = 'DNS';
                    else rpFormatted = formatMetric(att.official_result || att.attemp_rp, attDiscipline || sessionInfo.discipline);
                }

                // En SESSION_OVERVIEW los intentos en curso se muestran como no iniciados:
                // sin highlight is-performing y con "-" en RP (no hay valores estimados).
                const rowPerformingClass = '';

                html += `
                <div class="apnea-row ${rowPerformingClass}" id="session-row-${att.attemp_id}">
                    <div class="apnea-col-ot">${htmlDecode(ot)}</div>
                    <div class="apnea-col-lane">${htmlDecode(String(lane))}</div>
                    <div class="apnea-col-flag"><span class="${flagClass}" title="${country}"></span></div>
                    <div class="apnea-col-country">${htmlDecode(country)}</div>
                    <div class="apnea-col-athlete" title="${htmlDecode(name)}">${htmlDecode(name)}</div>
                    <div class="apnea-col-discipline">${htmlDecode(attDiscipline)}</div>
                    <div class="apnea-col-ap">${htmlDecode(apFormatted)}</div>
                    <div class="apnea-col-rp" id="session-rp-${att.attemp_id}">${htmlDecode(rpFormatted)}</div>
                    <div class="apnea-col-card">
                        <span class="card-indicator ${cardInfo.cardClass}" id="session-card-${att.attemp_id}"></span>
                    </div>
                    <div class="apnea-col-notes" id="session-notes-${att.attemp_id}">${noteHtml}</div>
                </div>`;
            });

            container.innerHTML = html;

            // Mantener fija la altura del contenedor con el tamaño de la página inicial
            if (pageIdx === 0) {
                container.style.minHeight = '';
                requestAnimationFrame(() => {
                    if (container.offsetHeight > 0) {
                        lockedContainerHeight = container.offsetHeight;
                        container.style.minHeight = `${lockedContainerHeight}px`;
                    }
                });
            } else if (lockedContainerHeight > 0) {
                container.style.minHeight = `${lockedContainerHeight}px`;
            }
        }

        // Ticker de valores en vivo para la página activa
        function startLiveTicker() {
            if (liveTickerTimer) clearInterval(liveTickerTimer);
            liveTickerTimer = setInterval(tickLiveValues, 200);
        }

        function stopLiveTicker() {
            if (liveTickerTimer) {
                clearInterval(liveTickerTimer);
                liveTickerTimer = null;
            }
        }

        function tickLiveValues() {
            if (!isOverlayVisible || isTransitioningPage) return;

            const sessionInfo = getActiveSessionInfo();
            if (!sessionInfo) return;

            const nowMs = Date.now() - clockOffset;
            const slice = pageSlices[currentPageIndex] || { start: 0, end: currentSessionAttempts.length, count: currentSessionAttempts.length };
            const pageAttempts = currentSessionAttempts.slice(slice.start, slice.end);
            const isDynamic = ['DYN', 'DYNB', 'DNF'].includes(sessionInfo.discipline);
            const athletesList = appState.athletes || [];

            pageAttempts.forEach(att => {
                const rpEl = e(`session-rp-${att.attemp_id}`);
                const cardEl = e(`session-card-${att.attemp_id}`);
                const notesEl = e(`session-notes-${att.attemp_id}`);
                const rowEl = e(`session-row-${att.attemp_id}`);
                if (!rpEl) return;

                const isJudged = att.attemp_status === 'JUDGED' || att.attemp_status === 'DQ' || Boolean(att.attemp_card) || att.attemp_status === 'DNS';
                const isPerforming = att.attemp_status === 'PERFORMING';
                const cardInfo = getAttemptCardAndNotes(att, isJudged, nowMs, appState.competition, clockOffset);

                if (rowEl) {
                    // SESSION_OVERVIEW no muestra highlight de fila en curso
                    rowEl.classList.remove('is-performing');
                }

                if (cardEl) {
                    cardEl.className = `card-indicator ${cardInfo.cardClass}`;
                }

                if (notesEl) {
                    // En SESSION_OVERVIEW solo mostrar notas si el intento ya fue juzgado
                    notesEl.innerHTML = isJudged ? cardInfo.noteHtml : '';
                }

                if (isJudged) {
                    rpEl.classList.remove('is-live');
                    let resultDisplay = '';
                    if (att.attemp_card === 'red' || att.attemp_status === 'DQ') resultDisplay = 'DQ';
                    else if (att.attemp_card === 'dns' || att.attemp_status === 'DNS') resultDisplay = 'DNS';
                    else resultDisplay = formatMetric(att.official_result || att.attemp_rp, sessionInfo.discipline);
                    rpEl.innerHTML = htmlDecode(resultDisplay);
                } else {
                    rpEl.classList.remove('is-live');
                    rpEl.innerHTML = '-';
                }
            });
        }

        // Temporizador de Paginación Automática con Auto-Exit al finalizar
        function startPaginationTimer() {
            stopPaginationTimer();
            paginationInterval = setInterval(() => {
                if (!isOverlayVisible) return;
                if (currentPageIndex + 1 < totalPages) {
                    const nextIdx = currentPageIndex + 1;
                    animatePageTransition(nextIdx);
                } else {
                    // Fin del tiempo visible de la última página -> ejecutar animación de salida
                    stopPaginationTimer();
                    runAnimationOUT();
                }
            }, pageDurationMs);
        }

        function stopPaginationTimer() {
            if (paginationInterval) {
                clearInterval(paginationInterval);
                paginationInterval = null;
            }
        }

        // Transición de página: barrido vertical puro (salida de abajo hacia arriba, entrada de arriba hacia abajo)
        function animatePageTransition(nextIdx) {
            if (isTransitioningPage) return;
            isTransitioningPage = true;

            const currentRows = document.querySelectorAll('#lanesContainer .apnea-row');
            if (currentRows.length === 0) {
                currentPageIndex = nextIdx;
                renderPageRows(currentPageIndex);
                isTransitioningPage = false;
                return;
            }

            // 1. Salida: borra en orden inverso (última línea -> anteúltima -> ... -> primera línea)
            anime({
                targets: currentRows,
                opacity: [1, 0],
                easing: 'easeInQuad',
                duration: 140,
                delay: anime.stagger(20, { from: 'last' }),
                complete: function() {
                    currentPageIndex = nextIdx;
                    renderPageRows(currentPageIndex);

                    const newRows = document.querySelectorAll('#lanesContainer .apnea-row');
                    // 2. Entrada: rellena en orden directo (línea 1 -> línea 2 -> ... -> última línea)
                    anime({
                        targets: newRows,
                        opacity: [0, 1],
                        easing: 'easeOutCubic',
                        duration: 180,
                        delay: anime.stagger(20, { from: 'first' }),
                        complete: function() {
                            isTransitioningPage = false;
                        }
                    });
                }
            });
        }

        // =========================================================
        // HANDLERS SPX (runTemplateUpdate, runAnimationIN, runAnimationOUT)
        // =========================================================
        async function runTemplateUpdate() {
            if (e('DynamicTheme') && e('f99') && e('f99').innerText.trim() !== '') {
                e('DynamicTheme').href = e('f99').innerText.trim();
            }

            applyLayoutConfig();
            await loadInitialData();

            if (!eventSource) {
                setupLiveUpdates();
            }

            startLiveTicker();
            runAnimationIN();
        }

        // Animación de entrada: Cortina que baja desde arriba
        function runAnimationIN() {
            isOverlayVisible = true;
            if (window.spxSetState) window.spxSetState('PLAYING');

            anime.remove('#gfx');
            anime.remove('.apnea-row');

            // Renderizar primera página fresca
            currentPageIndex = 0;
            lockedContainerHeight = 0;
            syncSessionData();

            // Preparar estado inicial para apertura de cortina desde arriba hacia abajo
            anime.set('#gfx', {
                opacity: 1,
                clipPath: 'inset(0% 0% 100% 0%)'
            });

            anime.set('.apnea-row', {
                opacity: 0
            });

            var tl = anime.timeline({
                easing: 'easeOutCubic',
                complete: function() {
                    anime.set('#gfx', { clipPath: 'none', opacity: 1 });
                    anime.set('.apnea-row', { opacity: 1 });
                    if (window.spxSetState) window.spxSetState('PLAYING');
                    startPaginationTimer();
                }
            });

            // Apertura de cortina vertical
            tl.add({
                targets: '#gfx',
                clipPath: ['inset(0% 0% 100% 0%)', 'inset(0% 0% 0% 0%)'],
                duration: 480
            }, 0)
            // Entrada con barrido vertical de filas iniciales
            .add({
                targets: '.apnea-row',
                opacity: [0, 1],
                duration: 260,
                delay: anime.stagger(20)
            }, 120);
        }

        // Animación de salida: Cortina que sube de abajo hacia arriba (invertido)
        function runAnimationOUT() {
            stopPaginationTimer();

            if (!isOverlayVisible) {
                if (window.spxSetState) window.spxSetState('STOPPED');
                return;
            }

            isOverlayVisible = false;
            if (window.spxSetState) window.spxSetState('STOPPING');

            anime.remove(['#gfx', '.apnea-row']);

            var tl = anime.timeline({
                easing: 'easeInCubic',
                complete: function() {
                    anime.set('#gfx', { opacity: 0, clipPath: 'inset(0% 0% 100% 0%)' });
                    if (window.spxSetState) window.spxSetState('STOPPED');
                }
            });

            // Desvanecer filas rápidamente
            tl.add({
                targets: '.apnea-row',
                opacity: 0,
                duration: 140
            }, 0)
            // Cierre de cortina vertical de abajo hacia arriba
            .add({
                targets: '#gfx',
                clipPath: ['inset(0% 0% 0% 0%)', 'inset(100% 0% 0% 0%)'],
                opacity: 0,
                duration: 320
            }, 60);
        }

        // Inicialización en carga DOM
        window.addEventListener('DOMContentLoaded', () => {
            try {
                applyLayoutConfig();
                loadInitialData();
                setupLiveUpdates();
                startLiveTicker();

                if (typeof window !== 'undefined' && window.location && window.location.search) {
                    const urlParams = new URLSearchParams(window.location.search);
                    if (urlParams.has('autostart') || urlParams.has('live') || urlParams.has('show')) {
                        setTimeout(runAnimationIN, 150);
                    }
                }
            } catch (err) {
                console.error("Error en inicialización SESSION_OVERVIEW:", err);
            }
        });

        // =========================================================
        // DEFINICIÓN DE METADATOS SPX (SPXGCTemplateDefinition)
        // =========================================================
        window.SPXGCTemplateDefinition = {
            "description": "Session Overview (Full Session with Auto-Pagination)",
            "playserver": "OVERLAY",
            "playchannel": "1",
            "playlayer": "3",
            "webplayout": "3",
            "out": "manual",
            "dataformat": "json",
            "uicolor": "4",
            "DataFields": [
                {
                    "ftype": "instruction",
                    "value": "Displays the full session attempt list with auto-pagination, OT column, discipline, and curtain transitions."
                },
                {
                    "field": "_ITEMS_PER_PAGE",
                    "ftype": "dropdown",
                    "title": "Attempts Per Page",
                    "value": "12",
                    "items": [
                        { "text": "12 por página", "value": "12" },
                        { "text": "14 por página", "value": "14" },
                        { "text": "16 por página", "value": "16" },
                        { "text": "18 por página", "value": "18" },
                        { "text": "20 por página", "value": "20" },
                        { "text": "22 por página", "value": "22" },
                        { "text": "24 por página", "value": "24" }
                    ]
                },
                {
                    "field": "_PAGE_DURATION",
                    "ftype": "dropdown",
                    "title": "Page Display Time",
                    "value": "7",
                    "items": [
                        { "text": "5 Seconds", "value": "5" },
                        { "text": "7 Seconds (Recommended)", "value": "7" },
                        { "text": "8 Seconds", "value": "8" },
                        { "text": "9 Seconds", "value": "9" },
                        { "text": "10 Seconds", "value": "10" }
                    ]
                },
                {
                    "field": "_POSITION",
                    "ftype": "dropdown",
                    "title": "Screen Position",
                    "value": "pos-bottom-left",
                    "items": [
                        { "text": "Center Screen (Center-Center)", "value": "pos-center-center" },
                        { "text": "Bottom Left (Bottom-Left)", "value": "pos-bottom-left" },
                        { "text": "Bottom Right (Bottom-Right)", "value": "pos-bottom-right" },
                        { "text": "Top Left (Top-Left)", "value": "pos-top-left" },
                        { "text": "Top Right (Top-Right)", "value": "pos-top-right" },
                        { "text": "Center Left (Center-Left)", "value": "pos-center-left" },
                        { "text": "Center Right (Center-Right)", "value": "pos-center-right" },
                        { "text": "Bottom Center (Bottom-Center)", "value": "pos-bottom-center" }
                    ]
                },
                {
                    "field": "_SIZE",
                    "ftype": "dropdown",
                    "title": "Panel Size",
                    "value": "size-wide",
                    "items": [
                        { "text": "Compact (40% width)", "value": "size-compact" },
                        { "text": "Standard (50% width)", "value": "size-standard" },
                        { "text": "Wide (62% width)", "value": "size-wide" },
                        { "text": "Full (75% width)", "value": "size-full" }
                    ]
                },
                {
                    "field": "_SHOW_NOTES",
                    "ftype": "dropdown",
                    "title": "Notes Column",
                    "value": "true",
                    "items": [
                        { "text": "Show Notes", "value": "true" },
                        { "text": "Hide Notes", "value": "false" }
                    ]
                },
                {
                    "field": "f99",
                    "ftype": "filelist",
                    "title": "Visual Theme",
                    "assetfolder": "./themes/",
                    "extension": "css",
                    "value": "./themes/Apnea_Broadcast.css"
                },
                {
                    "field": "_API_HOST",
                    "ftype": "textfield",
                    "title": "API Host URL (Optional)",
                    "value": ""
                }
            ]
        };
    </script>
</head>
<body>

    <div class="SPXWindow">
        <div id="gfx" class="apnea-panel session-table pos-bottom-left size-wide">
            <!-- Encabezado de la Sesión -->
            <div class="apnea-header">
                <div class="apnea-header-title">
                    <span id="sessionTitle">SESIÓN ACTIVA</span>

            <div class="apnea-table-head">

            <div class="apnea-footer">

    <!-- Contenedor Oculto de Datos SPX -->
    <div id="hiddenSpxData">
        <div id="_ITEMS_PER_PAGE"></div>

</body>
