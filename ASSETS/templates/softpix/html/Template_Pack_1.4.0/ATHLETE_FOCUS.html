<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <title>Apnea - Athlete Focus Lower-Third</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Scripts Principales -->
    <script type="text/javascript" src="js/lib/anime.min.js"></script>
    <script type="text/javascript" src="js/spx_interface.js"></script>
    <script type="text/javascript" src="js/apnea-helpers.js"></script>
    <script type="text/javascript" src="js/api-client.js"></script>
    
    <!-- Estilos y Tema Dinámico -->
    <link rel="stylesheet" type="text/css" href="css/styles.css" />
    <link rel="stylesheet" type="text/css" href="css/flag-icon.css" />
    <link rel="stylesheet" type="text/css" id="DynamicTheme" href="themes/Apnea_Broadcast.css" />

    <style>
        .SPXWindow {
            position: absolute;
            width: 100vw;
            height: 100vh;
            top: 0;
            left: 0;
            pointer-events: none;
            overflow: hidden;
        }

        #gfx {
            position: absolute;
            opacity: 0; /* Controlado por Anime.js */
            box-sizing: border-box;
            z-index: 10;
            transform-origin: left center;
            will-change: transform, opacity;
        }

        /* Ocultar notas si está deshabilitada en SPX */
        #gfx.hide-notes #focusNotes {
            display: none !important;
        }
    </style>

    <script>
        // Helper local seguro para elementos DOM
        function e(elementID) {
            if (!elementID) return null;
            return document.getElementById(elementID);
        }

        // Aplicar Posición y Toggles Visuales desde Configuración SPX
        function applyLayoutConfig() {
            const gfx = e('gfx');
            if (!gfx) return;

            // 1. Posición en Pantalla
            let positionClass = 'pos-bottom-left';
            const spxPos = e('_POSITION') ? e('_POSITION').innerText.trim().toLowerCase() : '';
            let urlPos = '';
            try {
                const urlParams = new URLSearchParams(window.location.search);
                urlPos = (urlParams.get('pos') || urlParams.get('position') || '').toLowerCase();
            } catch (_) {}
            const targetPos = spxPos || urlPos;

            if (targetPos) {
                if (targetPos.includes('center-center') || targetPos === 'pos-center-center') positionClass = 'pos-center-center';
                else if (targetPos.includes('bottom-right')) positionClass = 'pos-bottom-right';
                else if (targetPos.includes('top-left')) positionClass = 'pos-top-left';
                else if (targetPos.includes('top-right')) positionClass = 'pos-top-right';
                else if (targetPos.includes('center-left')) positionClass = 'pos-center-left';
                else if (targetPos.includes('center-right')) positionClass = 'pos-center-right';
                else if (targetPos.includes('bottom-center')) positionClass = 'pos-bottom-center';
                else positionClass = 'pos-bottom-left';
            }

            // 2. Toggle de Notas
            const spxNotes = e('_SHOW_NOTES') ? e('_SHOW_NOTES').innerText.trim().toLowerCase() : '';
            let urlNotes = '';
            try {
                const urlParams = new URLSearchParams(window.location.search);
                urlNotes = (urlParams.get('notes') || urlParams.get('shownotes') || '').toLowerCase();
            } catch (_) {}
            const targetNotes = spxNotes || urlNotes;
            const hideNotesClass = (targetNotes === 'false' || targetNotes === '0' || targetNotes === 'hide' || targetNotes === 'no') ? 'hide-notes' : '';

            gfx.className = `athlete-focus-panel ${positionClass} ${hideNotesClass}`.trim();
        }

        // Obtener el carril seleccionado (Lane 1 a 8)
        function getSelectedLane() {
            const spxLane = e('_LANE_SELECT') ? e('_LANE_SELECT').innerText.trim() : '';
            let urlLane = '';
            try {
                const urlParams = new URLSearchParams(window.location.search);
                urlLane = urlParams.get('lane') || urlParams.get('carril') || '';
            } catch (_) {}
            const target = spxLane || urlLane;
            const num = parseInt(target.replace(/\D/g, ''), 10);
            return (!isNaN(num) && num >= 1 && num <= 8) ? num : 1;
        }

        // =========================================================
        // MOTOR DE ESTIMACIÓN DINÁMICA & ESTADO
        // =========================================================
        const liveTrackers = new Map();

        // Parser de parámetros de velocidad e intervalo de posta
        function getCompetitionParams(attempt, competition) {
            const disc = (attempt ? (attempt.attemp_discipline || '') : '').trim().toUpperCase();
            const compSpeeds = (competition && competition.initial_speeds) ? competition.initial_speeds : {};
            const gender = (attempt && (attempt.athlete_gender || attempt.gender) ? (attempt.athlete_gender || attempt.gender) : 'M').trim().toUpperCase();

            let initialV = 1.0;
            if (compSpeeds[disc] !== undefined) {
                if (typeof compSpeeds[disc] === 'object' && compSpeeds[disc] !== null) {
                    const speedByGender = compSpeeds[disc][gender] || compSpeeds[disc].M || compSpeeds[disc].default;
                    if (speedByGender !== undefined && !isNaN(parseFloat(speedByGender))) {
                        initialV = parseFloat(speedByGender);
                    }
                } else if (!isNaN(parseFloat(compSpeeds[disc]))) {
                    initialV = parseFloat(compSpeeds[disc]);
                }
            } else if (compSpeeds.default !== undefined && !isNaN(parseFloat(compSpeeds.default))) {
                initialV = parseFloat(compSpeeds.default);
            } else {
                if (disc === 'DNF') initialV = 0.95;
                else if (disc === 'DYNB') initialV = 1.05;
                else if (disc === 'DYN') initialV = 1.15;
            }

            const intervaloPosta = (competition && competition.distance_step && !isNaN(parseFloat(competition.distance_step)))
                ? parseFloat(competition.distance_step)
                : 5;

            return { initialV, intervaloPosta };
        }

        function calculatePureDistance(attempt, competition, targetTimeMs) {
            if (!attempt) return 0;
            const { initialV, intervaloPosta } = getCompetitionParams(attempt, competition);
            let updates = (attempt.judge_updates || []).filter(u => new Date(u.timestamp).getTime() <= targetTimeMs);
            let startEvent = updates.find(u => u.event_type === 'START');

            if (!startEvent && (attempt.started_at || attempt.start_time || attempt.start_timestamp || attempt.timestamp)) {
                startEvent = {
                    event_type: 'START',
                    timestamp: attempt.started_at || attempt.start_time || attempt.start_timestamp || attempt.timestamp
                };
                updates.unshift(startEvent);
            }

            if (!startEvent) return 0;

            let D_base = 0;
            let T_base = new Date(startEvent.timestamp).getTime();
            let V_actual = initialV;

            const splits = updates
                .filter(u => u.event_type === 'LAP')
                .sort((a, b) => new Date(a.timestamp).getTime() - new Date(b.timestamp).getTime());

            for (const split of splits) {
                const T_real = new Date(split.timestamp).getTime();
                const deltaT_split = Math.max(0.1, (T_real - T_base) / 1000);

                let D_estimada_al_click = D_base + (V_actual * deltaT_split);
                let postaMasCercana = Math.round(D_estimada_al_click / intervaloPosta) * intervaloPosta;

                if (postaMasCercana <= D_base) {
                    postaMasCercana = D_base + intervaloPosta;
                }

                const deltaD_split = postaMasCercana - D_base;
                const velocidadCalculada = deltaD_split / deltaT_split;

                const VELOCIDAD_CAP = 2.0;
                const VELOCIDAD_MISCLICK = 4.0;

                if (velocidadCalculada < VELOCIDAD_MISCLICK) {
                    if (deltaT_split > 0 && deltaD_split > 0) {
                        V_actual = Math.max(0.2, Math.min(velocidadCalculada, VELOCIDAD_CAP));
                    }
                    D_base = postaMasCercana;
                    T_base = T_real;
                }
            }

            const rawDeltaT = Math.max(0, (targetTimeMs - T_base) / 1000);
            let D_final = D_base + (V_actual * rawDeltaT);

            const maximoPermitido = D_base + (intervaloPosta * 3) - 0.01;
            if (D_final > maximoPermitido) {
                D_final = maximoPermitido;
            }

            return Math.floor(D_final);
        }

        function calculateLiveDynamicDistance(attempt, competition, nowMs = Date.now(), useSmoothing = true) {
            if (!attempt || !attempt.attemp_id) return 0;
            const attemptId = attempt.attemp_id;
            let updates = Array.isArray(attempt.judge_updates) ? [...attempt.judge_updates] : [];
            let startEvent = updates.find(u => u.event_type === 'START');

            if (!startEvent && (attempt.started_at || attempt.start_time || attempt.start_timestamp || attempt.timestamp)) {
                startEvent = {
                    event_type: 'START',
                    timestamp: attempt.started_at || attempt.start_time || attempt.start_timestamp || attempt.timestamp
                };
                updates.unshift(startEvent);
            }

            if (!startEvent) {
                const attemptKey = attempt.attemp_id || `lane_${attempt.attemp_lane}`;
                if (localAttemptStartMap.has(attemptKey)) {
                    startEvent = {
                        event_type: 'START',
                        timestamp: new Date(localAttemptStartMap.get(attemptKey)).toISOString()
                    };
                    updates.unshift(startEvent);
                }
            }

            if (updates.length === 0 || !startEvent) {
                if (liveTrackers.has(attemptId)) liveTrackers.delete(attemptId);
                return 0;
            }

            const stopEvent = updates.slice().reverse().find(u => u.event_type === 'PRESTOP' || u.event_type === 'FINAL');
            if (stopEvent) {
                if (liveTrackers.has(attemptId)) liveTrackers.delete(attemptId);
                return calculatePureDistance(attempt, competition, new Date(stopEvent.timestamp).getTime());
            }

            if (!useSmoothing) {
                return calculatePureDistance(attempt, competition, nowMs);
            }

            const { initialV, intervaloPosta } = getCompetitionParams(attempt, competition);
            const splits = updates
                .filter(u => u.event_type === 'LAP')
                .sort((a, b) => new Date(a.timestamp).getTime() - new Date(b.timestamp).getTime());

            let tracker = liveTrackers.get(attemptId);

            if (tracker && tracker.originalStartTimestamp !== startEvent.timestamp) {
                liveTrackers.delete(attemptId);
                tracker = undefined;
            }

            if (!tracker) {
                tracker = {
                    originalStartTimestamp: startEvent.timestamp,
                    D_base: 0,
                    T_base: new Date(startEvent.timestamp).getTime(),
                    V_actual: initialV,
                    D_actual: 0,
                    OffsetCorreccion: 0,
                    lastSplitTimestamp: startEvent.timestamp,
                    isNewSplitTick: false,
                    maxDeltaT: 0,
                    hasCustomSpeed: false
                };
                liveTrackers.set(attemptId, tracker);
            }

            const latestSplit = splits.length > 0 ? splits[splits.length - 1] : startEvent;

            if (tracker.lastSplitTimestamp !== latestSplit.timestamp) {
                const T_real = new Date(latestSplit.timestamp).getTime();
                const deltaT_total = Math.max(0.1, (T_real - tracker.T_base) / 1000);
                let D_estimada = tracker.D_base + (tracker.V_actual * deltaT_total);
                let D_real = Math.round(D_estimada / intervaloPosta) * intervaloPosta;

                if (D_real <= tracker.D_base) {
                    D_real = tracker.D_base + intervaloPosta;
                }

                const deltaD = D_real - tracker.D_base;
                const velocidadLap = deltaD / deltaT_total;

                const VELOCIDAD_CAP = 2.0;
                const VELOCIDAD_MISCLICK = 4.0;

                if (velocidadLap < VELOCIDAD_MISCLICK) {
                    if (deltaT_total > 0 && deltaD > 0) {
                        tracker.V_actual = Math.max(0.2, Math.min(velocidadLap, VELOCIDAD_CAP));
                        tracker.hasCustomSpeed = true;
                    }
                    tracker.D_base = D_real;
                    tracker.T_base = T_real;
                    tracker.OffsetCorreccion = D_real - tracker.D_actual;
                    tracker.isNewSplitTick = true;
                    tracker.maxDeltaT = 0;
                }
                tracker.lastSplitTimestamp = latestSplit.timestamp;
            }

            const rawDeltaT = Math.max(0, (nowMs - tracker.T_base) / 1000);
            if (rawDeltaT > tracker.maxDeltaT) {
                tracker.maxDeltaT = rawDeltaT;
            }

            const effectiveDeltaT = tracker.maxDeltaT;
            let D_proyectada = tracker.D_base + (tracker.V_actual * effectiveDeltaT);

            const maximoPermitido = tracker.D_base + (intervaloPosta * 3) - 0.01;
            if (D_proyectada > maximoPermitido) {
                D_proyectada = maximoPermitido;
            }

            let D_suavizada = D_proyectada;
            if (tracker.OffsetCorreccion !== 0) {
                const step = 0.05 * Math.sign(tracker.OffsetCorreccion);
                if (Math.abs(tracker.OffsetCorreccion) <= 0.05) {
                    tracker.OffsetCorreccion = 0;
                } else {
                    tracker.OffsetCorreccion -= step;
                }
                D_suavizada += tracker.OffsetCorreccion;
            }

            tracker.D_actual = Math.max(tracker.D_actual, D_suavizada);
            return Math.floor(tracker.D_actual);
        }

        let appState = { attempts: [], athletes: [], sessions: [], competition: {}, active_broadcast: {} };
        let clockOffset = 0;
        let liveTickerTimer = null;
        let eventSource = null;
        let isOverlayVisible = false;

        // Obtener la información del heat activo y del atleta enfocado
        function getFocusedAthleteData() {
            if (!appState || (!appState.sessions && !appState.heats) || !appState.attempts) return null;

            const activeBroadcast = appState.active_broadcast || {};
            let activeSessionId = activeBroadcast.session_id || "";
            let activeOt = activeBroadcast.session_ot || activeBroadcast.heat_ot || "";

            const sessionsList = appState.sessions || appState.heats || [];
            let activeSession = sessionsList.find(s => (s.session_id === activeSessionId || s.heat_id === activeSessionId));

            if (!activeSession && sessionsList.length > 0) {
                activeSession = sessionsList.find(s => s.status !== 'closed') || sessionsList[0];
                activeSessionId = activeSession.session_id || activeSession.heat_id;
            }

            if (!activeSession) return null;

            const sessionAttempts = (appState.attempts || []).filter(att => 
                att.session_id === activeSessionId || att.heat_id === activeSessionId
            );

            if (!activeOt) {
                const performingAtt = sessionAttempts.find(att => att.attemp_status === 'PERFORMING');
                if (performingAtt && performingAtt.attemp_ot) {
                    activeOt = performingAtt.attemp_ot;
                } else if (sessionAttempts.length > 0) {
                    activeOt = sessionAttempts[0].attemp_ot || "";
                }
            }

            let heatAttempts = sessionAttempts.filter(att => !activeOt || att.attemp_ot === activeOt);
            if (heatAttempts.length === 0 && sessionAttempts.length > 0) {
                heatAttempts = sessionAttempts;
            }

            const targetLane = getSelectedLane();
            let attempt = heatAttempts.find(a => parseInt(a.attemp_lane, 10) === targetLane);
            if (!attempt) {
                attempt = sessionAttempts.find(a => parseInt(a.attemp_lane, 10) === targetLane);
            }

            const athletesList = appState.athletes || [];
            const athlete = attempt ? (athletesList.find(a => a.athlete_id === attempt.athlete_id) || {}) : {};

            return {
                session: activeSession,
                sessionId: activeSessionId,
                ot: activeOt,
                discipline: ((attempt ? attempt.attemp_discipline : null) || activeSession.session_discipline || "STA").toUpperCase(),
                targetLane: targetLane,
                attempt: attempt,
                athlete: athlete
            };
        }

        // Renderizar la información del competidor
        function renderFocusedAthlete() {
            const data = getFocusedAthleteData();
            if (!data) return;

            const targetLane = data.targetLane;
            const att = data.attempt;
            const athlete = data.athlete || {};
            const discipline = data.discipline;

            if (!att) {
                if (e('focusFlag')) e('focusFlag').innerHTML = '';
                if (e('focusCountry')) e('focusCountry').innerText = '';
                if (e('focusName')) e('focusName').innerText = `LANE ${targetLane}`;
                if (e('focusDiscipline')) e('focusDiscipline').innerText = discipline;
                if (e('focusApVal')) e('focusApVal').innerText = '-';
                if (e('focusRpVal')) e('focusRpVal').innerText = '-';
                if (e('focusCard')) e('focusCard').innerHTML = '';
                if (e('focusNotes')) e('focusNotes').innerHTML = '';
                return;
            }

            // 1. Bandera y País
            const country = (athlete.athlete_country || att.athlete_country || '').toUpperCase();
            if (e('focusCountry')) e('focusCountry').innerText = country;
            if (e('focusFlag')) {
                if (country && country.length >= 2) {
                    const flagClass = `flag-icon flag-icon-${country.toLowerCase()}`;
                    e('focusFlag').innerHTML = `<span class="${flagClass}" title="${country}"></span>`;
                    e('focusFlag').style.display = 'flex';
                } else {
                    e('focusFlag').innerHTML = '';
                    e('focusFlag').style.display = 'none';
                }
            }

            // 2. Nombre
            const athleteName = athlete.athlete_name || att.athlete_name || 'ATLETA';
            if (e('focusName')) e('focusName').innerText = athleteName.toUpperCase();

            // 3. Disciplina
            if (e('focusDiscipline')) e('focusDiscipline').innerText = discipline;

            // 4. AP
            if (e('focusApVal')) e('focusApVal').innerText = formatMetric(att.attemp_ap, discipline);

            // 5. Valores en vivo / RP / Tarjeta / Notas
            tickLiveValues();
        }

        // Ticker de valores en tiempo real (segundo a segundo) con formato inline [STA] AP: xx | RP: xx | [card] [notes]
        function tickLiveValues() {
            const data = getFocusedAthleteData();
            if (!data || !data.attempt) return;

            const att = data.attempt;
            const athlete = data.athlete || {};
            const discipline = data.discipline;
            const targetLane = data.targetLane;
            const nowMs = Date.now() - clockOffset;
            const isDynamic = ['DYN', 'DYNB', 'DNF'].includes(discipline);

            const rpBox = e('focusRpBox');
            const rpVal = e('focusRpVal');
            const rpLabel = e('focusRpLabel');
            const cardBox = e('focusCard');
            const notesBox = e('focusNotes');

            const isJudged = att.attemp_status === 'JUDGED' || att.attemp_status === 'DQ' || Boolean(att.attemp_card) || att.attemp_status === 'DNS';
            const isPerforming = att.attemp_status === 'PERFORMING';
            const updates = Array.isArray(att.judge_updates) ? att.judge_updates : [];
            const isSpCanceledOrEnded = att.sp_canceled || att.sp_cancelled || att.sp_ended || 
                                        updates.some(u => ['SP_CANCEL', 'SP_END', 'CANCEL_SP', 'END_SP', 'CANCEL'].includes((u.event_type || u.type || '').toUpperCase()));

            const isDoneOrSP = (att.attemp_status === 'DONE' || 
                                Boolean(att.performance_finished_at && !att.attemp_card && !isJudged) ||
                                (updates.some(u => ['PRESTOP', 'STOP', 'FINAL', 'SURFACE', 'DONE'].includes((u.event_type || u.type || '').toUpperCase())) && !att.attemp_card && !isJudged))
                               && !isSpCanceledOrEnded;

            const cardInfo = getAttemptCardAndNotes(att, isJudged, nowMs, appState.competition, clockOffset, appState.session_date);

            // Tarjeta Oficial
            if (cardBox) {
                if (isJudged && cardInfo.cardClass && cardInfo.cardClass !== 'card-none') {
                    cardBox.innerHTML = `<span class="card-indicator ${cardInfo.cardClass}"></span>`;
                } else {
                    cardBox.innerHTML = '';
                }
            }

            // Notas / Protocolo (Sin "PRELIM.")
            if (notesBox) {
                if (cardInfo.noteHtml && !cardInfo.noteHtml.includes('note-prelim') && cardInfo.noteHtml.trim() !== '') {
                    notesBox.innerHTML = cardInfo.noteHtml;
                } else {
                    notesBox.innerHTML = '';
                }
            }

            // RP / Live Metric Inline
            if (isJudged) {
                if (rpBox) rpBox.classList.remove('is-live');
                if (rpLabel) rpLabel.innerText = 'RP:';

                let resultDisplay = '';
                const card = (att.attemp_card || '').toLowerCase();
                if (card === 'red' || att.attemp_status === 'DQ') {
                    resultDisplay = 'DQ';
                } else if (card === 'dns' || att.attemp_status === 'DNS') {
                    resultDisplay = 'DNS';
                } else {
                    const val = att.official_result || att.attemp_rp || '-';
                    resultDisplay = formatMetric(val, discipline);
                }
                if (rpVal) rpVal.innerText = resultDisplay;
            } else if (isPerforming || isDoneOrSP) {
                if (rpBox) rpBox.classList.add('is-live');
                if (rpLabel) rpLabel.innerText = 'LIVE:';

                if (isDynamic) {
                    const attemptForCalc = {
                        ...att,
                        athlete_gender: athlete.athlete_gender || att.athlete_gender || 'M',
                        attemp_discipline: discipline
                    };
                    const calcTime = isDoneOrSP ? getAttemptFinishMs(att, nowMs, appState.session_date) : nowMs;
                    const estimatedMeters = calculateLiveDynamicDistance(
                        attemptForCalc,
                        appState.competition,
                        calcTime,
                        !isDoneOrSP
                    );
                    if (rpVal) rpVal.innerText = `${estimatedMeters} m`;
                } else {
                    // STA: Cálculo continuo y estable
                    let rawStartTime = att.started_at || att.start_time || att.performance_started_at || att.timestamp;
                    if (!rawStartTime && Array.isArray(att.judge_updates)) {
                        const startEv = att.judge_updates.find(u => (u.event_type || u.type || '').toUpperCase() === 'START');
                        if (startEv) rawStartTime = startEv.timestamp || startEv.time || startEv.created_at;
                    }

                    const attemptKey = att.attemp_id || `lane_${targetLane}`;
                    let parsedStartMs = parseTimestampMs(rawStartTime, appState.session_date);

                    if (parsedStartMs > 0) {
                        if (!localAttemptStartMap.has(attemptKey) || Math.abs(localAttemptStartMap.get(attemptKey) - parsedStartMs) > 1500) {
                            localAttemptStartMap.set(attemptKey, parsedStartMs);
                        }
                    } else if (!localAttemptStartMap.has(attemptKey)) {
                        localAttemptStartMap.set(attemptKey, nowMs);
                    }

                    const startMs = localAttemptStartMap.get(attemptKey);
                    const endMs = isDoneOrSP ? getAttemptFinishMs(att, nowMs, appState.session_date) : nowMs;
                    const elapsedSec = Math.max(0, (endMs - startMs) / 1000);
                    const mins = Math.floor(elapsedSec / 60);
                    const secs = Math.floor(elapsedSec % 60);
                    if (rpVal) rpVal.innerText = `${mins}:${String(secs).padStart(2, '0')}`;
                }
            } else {
                const attemptKey = att.attemp_id || `lane_${targetLane}`;
                localAttemptStartMap.delete(attemptKey);
                liveTrackers.delete(attemptKey);

                if (rpBox) rpBox.classList.remove('is-live');
                if (rpLabel) rpLabel.innerText = 'RP:';
                if (rpVal) rpVal.innerText = formatMetric(att.preliminary_result || att.attemp_rp || '-', discipline);
            }
        }

        // Iniciar Ticker
        function startLiveTicker() {
            if (liveTickerTimer) clearInterval(liveTickerTimer);
            liveTickerTimer = setInterval(() => {
                if (isOverlayVisible) {
                    tickLiveValues();
                }
            }, 200);
        }

        function stopLiveTicker() {
            if (liveTickerTimer) {
                clearInterval(liveTickerTimer);
                liveTickerTimer = null;
            }
        }

        // Cargar estado inicial desde API
        async function loadInitialData() {
            try {
                const apiBase = getApiBaseUrl();
                const res = await fetch(`${apiBase}/api/all`);
                if (!res.ok) throw new Error(`HTTP Error ${res.status}`);
                const data = await res.json();

                clockOffset = Date.now() - (data.server_now || Date.now());
                appState = data;
                renderFocusedAthlete();
            } catch (err) {
                console.error("Error cargando datos iniciales ATHLETE_FOCUS:", err);
            }
        }

        // Conectar SSE para streaming en vivo
        function setupLiveUpdates() {
            if (eventSource) {
                eventSource.close();
                eventSource = null;
            }
            try {
                const apiBase = getApiBaseUrl();
                eventSource = new EventSource(`${apiBase}/api/events`);

                eventSource.onopen = () => {
                    loadInitialData();
                };

                eventSource.onmessage = async (e) => {
                    if (e.data === 'update' || !e.data || e.data === 'connected') {
                        try {
                            const apiBase = getApiBaseUrl();
                            const res = await fetch(`${apiBase}/api/all`);
                            if (res.ok) {
                                const data = await res.json();
                                clockOffset = Date.now() - (data.server_now || Date.now());
                                appState = data;
                                renderFocusedAthlete();
                            }
                        } catch (err) {
                            console.error("Error procesando evento SSE:", err);
                        }
                    }
                };

                eventSource.onerror = () => {
                    if (eventSource) eventSource.close();
                    eventSource = null;
                    setTimeout(setupLiveUpdates, 3000);
                };
            } catch (err) {
                console.error("Error iniciando SSE:", err);
            }
        }

        // =========================================================
        // CONTROL DE ANIMACIONES (ANIME.JS)
        // 1. Layout crece de izquierda a derecha -> Luego aparece el contenido
        // 2. Desaparece el contenido -> Layout se achica de derecha a izquierda
        // =========================================================
        function runTemplateUpdate() {
            if (e('DynamicTheme') && e('f99') && e('f99').innerText.trim() !== '') {
                e('DynamicTheme').href = e('f99').innerText.trim();
            }

            applyLayoutConfig();
            loadInitialData();

            if (!eventSource) {
                setupLiveUpdates();
            }

            startLiveTicker();
            runAnimationIN();
        }

        function runAnimationIN() {
            isOverlayVisible = true;
            if (window.spxSetState) window.spxSetState('PLAYING');

            anime.remove(['#gfx', '#focusContent']);
            renderFocusedAthlete();

            // 1. Reset: Layout inicia con escala 0 a la izquierda, contenido transparente
            const gfxEl = e('gfx');
            if (gfxEl) {
                gfxEl.style.transformOrigin = 'left center';
            }

            anime.set('#gfx', {
                opacity: 1,
                scaleX: 0
            });

            anime.set('#focusContent', {
                opacity: 0,
                translateX: -16
            });

            var tl = anime.timeline({
                easing: 'easeOutCubic',
                complete: function() {
                    anime.set('#gfx', { opacity: 1, scaleX: 1 });
                    anime.set('#focusContent', { opacity: 1, translateX: 0 });
                    if (window.spxSetState) window.spxSetState('PLAYING');
                }
            });

            // Paso 1: Layout crece de izquierda a derecha
            tl.add({
                targets: '#gfx',
                scaleX: [0, 1],
                opacity: [0, 1],
                duration: 380,
                easing: 'easeOutCubic'
            }, 0)
            // Paso 2: Luego aparece el contenido
            .add({
                targets: '#focusContent',
                opacity: [0, 1],
                translateX: [-16, 0],
                duration: 280,
                easing: 'easeOutQuad'
            }, 240);
        }

        function runAnimationOUT() {
            isOverlayVisible = false;
            if (window.spxSetState) window.spxSetState('STOPPING');

            anime.remove(['#gfx', '#focusContent']);

            const gfxEl = e('gfx');
            if (gfxEl) {
                gfxEl.style.transformOrigin = 'right center';
            }

            var tl = anime.timeline({
                easing: 'easeInOutCubic',
                complete: function() {
                    anime.set('#gfx', { opacity: 0, scaleX: 0 });
                    if (gfxEl) gfxEl.style.transformOrigin = 'left center';
                    if (window.spxSetState) window.spxSetState('STOPPED');
                }
            });

            // Paso 1: Primero desaparece el contenido
            tl.add({
                targets: '#focusContent',
                opacity: [1, 0],
                translateX: [0, 16],
                duration: 180,
                easing: 'easeInQuad'
            }, 0)
            // Paso 2: Luego el layout se achica de derecha a izquierda
            .add({
                targets: '#gfx',
                scaleX: [1, 0],
                opacity: [1, 0],
                duration: 320,
                easing: 'easeInOutCubic'
            }, 120);
        }

        window.addEventListener('DOMContentLoaded', () => {
            try {
                applyLayoutConfig();
                loadInitialData();
                setupLiveUpdates();
                startLiveTicker();

                if (typeof window !== 'undefined' && window.location && window.location.search) {
                    const urlParams = new URLSearchParams(window.location.search);
                    if (urlParams.has('autostart') || urlParams.has('live') || urlParams.has('show')) {
                        setTimeout(runAnimationIN, 150);
                    }
                }
            } catch (err) {
                console.error("Error en inicialización ATHLETE_FOCUS:", err);
            }
        });

        // =========================================================
        // DEFINICIÓN DE METADATOS SPX (SPXGCTemplateDefinition)
        // =========================================================
        window.SPXGCTemplateDefinition = {
            "description": "Athlete Focus (Horizontal Lower-Third 70% Width)",
            "playserver": "OVERLAY",
            "playchannel": "1",
            "playlayer": "3",
            "webplayout": "3",
            "out": "manual",
            "dataformat": "json",
            "uicolor": "2",
            "DataFields": [
                {
                    "ftype": "instruction",
                    "value": "Displays a 70% width horizontal lower-third banner for a single competitor/lane with smooth expand/shrink animations."
                },
                {
                    "field": "_LANE_SELECT",
                    "ftype": "dropdown",
                    "title": "Select Lane",
                    "value": "1",
                    "items": [
                        { "text": "Lane 1", "value": "1" },
                        { "text": "Lane 2", "value": "2" },
                        { "text": "Lane 3", "value": "3" },
                        { "text": "Lane 4", "value": "4" },
                        { "text": "Lane 5", "value": "5" },
                        { "text": "Lane 6", "value": "6" },
                        { "text": "Lane 7", "value": "7" },
                        { "text": "Lane 8", "value": "8" }
                    ]
                },
                {
                    "field": "_POSITION",
                    "ftype": "dropdown",
                    "title": "Screen Position",
                    "value": "pos-bottom-left",
                    "items": [
                        { "text": "Bottom Left (pos-bottom-left)", "value": "pos-bottom-left" },
                        { "text": "Bottom Center (pos-bottom-center)", "value": "pos-bottom-center" },
                        { "text": "Bottom Right (pos-bottom-right)", "value": "pos-bottom-right" },
                        { "text": "Top Left (pos-top-left)", "value": "pos-top-left" },
                        { "text": "Top Right (pos-top-right)", "value": "pos-top-right" },
                        { "text": "Center Screen (pos-center-center)", "value": "pos-center-center" }
                    ]
                },
                {
                    "field": "_SHOW_NOTES",
                    "ftype": "dropdown",
                    "title": "Notes Column",
                    "value": "true",
                    "items": [
                        { "text": "Show Notes", "value": "true" },
                        { "text": "Hide Notes", "value": "false" }
                    ]
                },
                {
                    "field": "f99",
                    "ftype": "filelist",
                    "title": "Visual Theme",
                    "assetfolder": "./themes/",
                    "extension": "css",
                    "value": "./themes/Apnea_Broadcast.css"
                },
                {
                    "field": "_API_HOST",
                    "ftype": "textfield",
                    "title": "API Host URL (Optional)",
                    "value": ""
                }
            ]
        };
    </script>
</head>
<body>

    <div class="SPXWindow">
        <div id="gfx" class="athlete-focus-panel pos-bottom-left">
            <div class="focus-content" id="focusContent">
                <!-- 1. Grupo Izquierdo: Bandera, País y Nombre -->
                <div class="focus-left-group">
                    <div class="focus-flag-box">
                        <div class="focus-flag" id="focusFlag"></div>
                        <div class="focus-country" id="focusCountry"></div>
                    </div>

                    <div class="focus-divider"></div>

                    <div class="focus-name" id="focusName">ATLETA</div>
                </div>

                <!-- 2. Grupo Derecho: [STA]  AP: xx:xx  |  RP: xx:xx  |  [card] [notes] -->
                <div class="focus-right-group">
                    <div class="focus-discipline" id="focusDiscipline">STA</div>

                    <div class="focus-stat-inline focus-stat-ap" id="focusApBox">
                        <span class="focus-stat-label">AP:</span>
                        <span class="focus-stat-value" id="focusApVal">-</span>
                    </div>

                    <div class="focus-divider"></div>

                    <div class="focus-stat-inline focus-stat-rp" id="focusRpBox">
                        <span class="focus-stat-label" id="focusRpLabel">RP:</span>
                        <span class="focus-stat-value" id="focusRpVal">-</span>
                    </div>

                    <div class="focus-divider"></div>

                    <div class="focus-card-notes-group">
                        <div class="focus-card-box" id="focusCard"></div>
                        <div class="focus-notes-box" id="focusNotes"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Contenedor Oculto de Datos SPX -->
    <div id="hiddenSpxData">
        <div id="_LANE_SELECT"></div>
        <div id="_POSITION"></div>
        <div id="_SHOW_NOTES"></div>
        <div id="_API_HOST"></div>
        <div id="f99"></div>
    </div>

</body>
</html>
