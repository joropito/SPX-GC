<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <title>Apnea - Athlete Focus Lower-Third</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Scripts Principales -->
    <script type="text/javascript" src="js/lib/anime.min.js"></script>
    <script type="text/javascript" src="js/spx_interface.js"></script>
    <script type="text/javascript" src="js/apnea-helpers.js"></script>
    
    <!-- Estilos y Tema Dinámico -->
    <link rel="stylesheet" type="text/css" href="css/styles.css" />
    <link rel="stylesheet" type="text/css" href="css/flag-icon.css" />
    <link rel="stylesheet" type="text/css" id="DynamicTheme" href="themes/Apnea_Broadcast.css" />

    <style>
        .SPXWindow {
            position: absolute;
            width: 100vw;
            height: 100vh;
            top: 0;
            left: 0;
            pointer-events: none;
            overflow: hidden;
        }

        #gfx {
            position: absolute;
            opacity: 0; /* Animado por Anime.js */
            box-sizing: border-box;
            z-index: 10;
            transform-origin: center center;
            will-change: transform, opacity;
        }

        /* Ocultar elementos según configuración SPX */
        #gfx.hide-photo .focus-avatar-container {
            display: none !important;
        }

        #gfx.hide-ap .focus-stat-ap {
            display: none !important;
        }

        #gfx.hide-timer .focus-timer-box {
            display: none !important;
        }

        #gfx.hide-pb .focus-pb-badge {
            display: none !important;
        }

        #gfx.hide-notes .focus-notes-box {
            display: none !important;
        }
    </style>

    <script>
        // Helper local seguro para elementos DOM
        function e(elementID) {
            if (!elementID) return null;
            return document.getElementById(elementID);
        }

        function htmlDecode(txt) {
            if (!txt) return '';
            try {
                var doc = new DOMParser().parseFromString(txt, "text/html");
                return doc.documentElement.textContent || '';
            } catch (_) {
                return txt;
            }
        }

        // Obtener Host de la API
        function getApiBaseUrl() {
            const spxHost = e('_API_HOST') ? e('_API_HOST').innerText.trim() : '';
            if (spxHost !== '') return spxHost.replace(/\/$/, '');
            
            try {
                const urlParams = new URLSearchParams(window.location.search);
                const paramHost = urlParams.get('api') || urlParams.get('host');
                if (paramHost) return paramHost.replace(/\/$/, '');

                if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
                    return `${window.location.protocol}//${window.location.hostname}:3100`;
                }
            } catch (_) {}
            return "https://apnea.glamsi.com";
        }

        // Formateador inteligente de marcas
        function formatMetric(val, discipline) {
            if (!val || val === '' || val === 'undefined' || val === 'null' || val === '-') return '-';
            const strVal = val.toString().trim();
            if (strVal === 'DNS' || strVal === 'DQ' || strVal === 'EN CURSO') return strVal;
            
            const disc = (discipline || '').toUpperCase();
            if (disc === 'STA') {
                if (strVal.includes(':')) {
                    if (strVal.startsWith('0') && strVal.indexOf(':') === 2) {
                        return strVal.substring(1);
                    }
                    return strVal;
                }
                const sec = parseFloat(strVal);
                if (!isNaN(sec)) {
                    const s = Math.max(0, Math.floor(sec));
                    const mins = Math.floor(s / 60);
                    const remSecs = s % 60;
                    return `${mins}:${String(remSecs).padStart(2, '0')}`;
                }
                return strVal;
            }

            const cleanStr = strVal.replace(/[^\d.-]/g, '');
            const num = parseFloat(cleanStr);
            if (isNaN(num)) return strVal;
            return `${Math.round(num)} m`;
        }

        function parseTimestampMs(val, sessionDate) {
            if (!val && val !== 0) return 0;
            if (typeof val === 'number') return val < 10000000000 ? val * 1000 : val;
            if (typeof val === 'string') {
                const str = val.trim();
                if (/^\d+$/.test(str)) {
                    const num = Number(str);
                    return num < 10000000000 ? num * 1000 : num;
                }
                const parsed = Date.parse(str);
                if (!isNaN(parsed) && parsed > 0) return parsed;

                const timeMatch = str.match(/^(\d{1,2}):(\d{2})(?::(\d{2}))?$/);
                if (timeMatch) {
                    const d = sessionDate ? new Date(sessionDate) : new Date();
                    d.setHours(parseInt(timeMatch[1], 10), parseInt(timeMatch[2], 10), parseInt(timeMatch[3] || '0', 10), 0);
                    return d.getTime();
                }
            }
            return 0;
        }

        // =========================================================
        // ESTADO GLOBAL Y SINCRONIZACIÓN
        // =========================================================
        let appState = { attempts: [], athletes: [], sessions: [], competition: {}, active_broadcast: {} };
        let clockOffset = 0;
        let liveTickerTimer = null;
        let eventSource = null;
        let isOverlayVisible = false;
        let localAttemptStartMap = new Map();
        let localAttemptFinishMap = new Map();

        // Aplicar Posición y Opciones Visuales desde Configuración SPX
        function applyLayoutConfig() {
            const gfx = e('gfx');
            if (!gfx) return;

            // 1. Posición
            let positionClass = 'pos-bottom-left';
            const spxPos = e('_POSITION') ? e('_POSITION').innerText.trim().toLowerCase() : '';
            let urlPos = '';
            try {
                const urlParams = new URLSearchParams(window.location.search);
                urlPos = (urlParams.get('pos') || urlParams.get('position') || '').toLowerCase();
            } catch (_) {}
            const targetPos = spxPos || urlPos;

            if (targetPos) {
                if (targetPos.includes('center-center') || targetPos === 'pos-center-center') positionClass = 'pos-center-center';
                else if (targetPos.includes('bottom-center') || targetPos === 'pos-bottom-center') positionClass = 'pos-bottom-center';
                else if (targetPos.includes('bottom-right') || targetPos === 'pos-bottom-right') positionClass = 'pos-bottom-right';
                else if (targetPos.includes('top-left') || targetPos === 'pos-top-left') positionClass = 'pos-top-left';
                else if (targetPos.includes('top-right') || targetPos === 'pos-top-right') positionClass = 'pos-top-right';
                else positionClass = 'pos-bottom-left';
            }

            // 2. Toggles de Componentes
            const spxPhoto = e('_SHOW_PHOTO') ? e('_SHOW_PHOTO').innerText.trim().toLowerCase() : '';
            const spxAp = e('_SHOW_AP') ? e('_SHOW_AP').innerText.trim().toLowerCase() : '';
            const spxTimer = e('_SHOW_TIMER') ? e('_SHOW_TIMER').innerText.trim().toLowerCase() : '';
            const spxPb = e('_SHOW_PB') ? e('_SHOW_PB').innerText.trim().toLowerCase() : '';
            const spxNotes = e('_SHOW_NOTES') ? e('_SHOW_NOTES').innerText.trim().toLowerCase() : '';

            let urlPhoto = '', urlAp = '', urlTimer = '', urlPb = '', urlNotes = '';
            try {
                const urlParams = new URLSearchParams(window.location.search);
                urlPhoto = (urlParams.get('photo') || '').toLowerCase();
                urlAp = (urlParams.get('ap') || '').toLowerCase();
                urlTimer = (urlParams.get('timer') || '').toLowerCase();
                urlPb = (urlParams.get('pb') || '').toLowerCase();
                urlNotes = (urlParams.get('notes') || '').toLowerCase();
            } catch (_) {}

            const hidePhotoClass = ((spxPhoto || urlPhoto) === 'false' || (spxPhoto || urlPhoto) === 'hide') ? 'hide-photo' : '';
            const hideApClass = ((spxAp || urlAp) === 'false' || (spxAp || urlAp) === 'hide') ? 'hide-ap' : '';
            const hideTimerClass = ((spxTimer || urlTimer) === 'false' || (spxTimer || urlTimer) === 'hide') ? 'hide-timer' : '';
            const hidePbClass = ((spxPb || urlPb) === 'false' || (spxPb || urlPb) === 'hide') ? 'hide-pb' : '';
            const hideNotesClass = ((spxNotes || urlNotes) === 'false' || (spxNotes || urlNotes) === 'hide') ? 'hide-notes' : '';

            gfx.className = `athlete-focus-panel ${positionClass} ${hidePhotoClass} ${hideApClass} ${hideTimerClass} ${hidePbClass} ${hideNotesClass}`.replace(/\s+/g, ' ').trim();
        }

        // Obtener el carril seleccionado desde SPX o URL
        function getSelectedLane() {
            const spxLane = e('_LANE_SELECT') ? e('_LANE_SELECT').innerText.trim() : '';
            let urlLane = '';
            try {
                const urlParams = new URLSearchParams(window.location.search);
                urlLane = urlParams.get('lane') || urlParams.get('carril') || '';
            } catch (_) {}
            const target = spxLane || urlLane;
            if (!target || target.toLowerCase().includes('auto') || target === '0') return 'auto';
            const num = parseInt(target.replace(/\D/g, ''), 10);
            return isNaN(num) ? 'auto' : num;
        }

        // Extraer intento y atleta enfocado
        function getFocusedAthleteData() {
            const sessionsList = Array.isArray(appState.sessions) ? appState.sessions : [];
            const activeBroadcast = appState.active_broadcast || {};
            
            let activeSession = null;
            let activeSessionId = activeBroadcast.active_session_id || activeBroadcast.session_id;

            if (activeSessionId) {
                activeSession = sessionsList.find(s => (s.session_id === activeSessionId || s.heat_id === activeSessionId));
            }
            if (!activeSession && sessionsList.length > 0) {
                activeSession = sessionsList.find(s => s.status !== 'closed') || sessionsList[0];
                activeSessionId = activeSession.session_id || activeSession.heat_id;
            }

            if (!activeSession) return null;

            const sessionAttempts = (appState.attempts || []).filter(att => 
                att.session_id === activeSessionId || att.heat_id === activeSessionId
            );

            // Determinar Heat Activo
            let targetAttempts = [];
            const activeOt = activeBroadcast.active_heat_ot || activeBroadcast.active_ot;
            if (activeOt) {
                targetAttempts = sessionAttempts.filter(att => (att.attemp_ot || '').trim() === activeOt.trim());
            }
            if (targetAttempts.length === 0) {
                const inProgress = sessionAttempts.filter(att => att.attemp_status === 'in_progress');
                if (inProgress.length > 0) {
                    const firstOt = (inProgress[0].attemp_ot || '').trim();
                    targetAttempts = sessionAttempts.filter(att => (att.attemp_ot || '').trim() === firstOt);
                }
            }
            if (targetAttempts.length === 0) {
                targetAttempts = sessionAttempts;
            }

            // Seleccionar carril
            const selectedLane = getSelectedLane();
            let targetAttempt = null;

            if (selectedLane !== 'auto') {
                targetAttempt = targetAttempts.find(att => parseInt(att.attemp_lane, 10) === selectedLane);
                if (!targetAttempt) {
                    targetAttempt = sessionAttempts.find(att => parseInt(att.attemp_lane, 10) === selectedLane);
                }
            } else {
                // Auto: primer intento en progreso o primer intento disponible
                targetAttempt = targetAttempts.find(att => att.attemp_status === 'in_progress') || targetAttempts[0];
            }

            if (!targetAttempt) return null;

            // Datos del atleta
            const athletesList = Array.isArray(appState.athletes) ? appState.athletes : [];
            const athlete = athletesList.find(a => 
                (a.athlete_id && a.athlete_id === targetAttempt.athlete_id) || 
                (a.id && a.id === targetAttempt.athlete_id)
            ) || {};

            const discipline = (targetAttempt.attemp_discipline || targetAttempt.discipline || activeSession.session_discipline || activeSession.discipline || 'STA').toUpperCase();

            return {
                session: activeSession,
                attempt: targetAttempt,
                athlete: athlete,
                discipline: discipline
            };
        }

        // Renderizar el contenido del atleta
        function renderFocusedAthlete() {
            const data = getFocusedAthleteData();
            if (!data) return;

            const { attempt, athlete, discipline } = data;

            // 1. Carril
            const laneVal = attempt.attemp_lane || '1';
            if (e('focusLane')) e('focusLane').innerText = laneVal;

            // 2. Avatar / Foto del Atleta
            const photoUrl = athlete.athlete_photo || athlete.photo || athlete.image || '';
            const athleteName = (athlete.athlete_name || athlete.name || attempt.athlete_name || 'ATLETA').trim();
            const avatarContainer = e('focusAvatar');

            if (avatarContainer) {
                if (photoUrl && photoUrl !== '') {
                    avatarContainer.innerHTML = `<img src="${photoUrl}" class="focus-avatar-img" alt="${athleteName}" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';" /><span class="focus-avatar-fallback" style="display:none;">${getInitials(athleteName)}</span>`;
                } else {
                    avatarContainer.innerHTML = `<span class="focus-avatar-fallback">${getInitials(athleteName)}</span>`;
                }
            }

            // 3. Bandera y País
            const countryCode = (athlete.athlete_country || athlete.country || attempt.athlete_country || '').trim().toUpperCase();
            if (e('focusCountry')) e('focusCountry').innerText = countryCode;

            if (e('focusFlag')) {
                if (countryCode && countryCode.length >= 2) {
                    const iso2 = getCountryIso2(countryCode);
                    e('focusFlag').innerHTML = `<span class="flag-icon flag-icon-${iso2.toLowerCase()}"></span>`;
                    e('focusFlag').style.display = 'flex';
                } else {
                    e('focusFlag').innerHTML = '';
                    e('focusFlag').style.display = 'none';
                }
            }

            // 4. Nombre
            if (e('focusName')) e('focusName').innerText = athleteName.toUpperCase();

            // 5. Disciplina
            if (e('focusDiscipline')) e('focusDiscipline').innerText = discipline;

            // 6. AP
            const apVal = formatMetric(attempt.attemp_ap, discipline);
            if (e('focusApVal')) e('focusApVal').innerText = apVal;

            // 7. PB (Personal Best)
            const pbVal = athlete.athlete_pb || athlete.pb || attempt.athlete_pb || '';
            const pbBadge = e('focusPb');
            if (pbBadge) {
                if (pbVal && pbVal !== '') {
                    pbBadge.innerText = `PB ${formatMetric(pbVal, discipline)}`;
                    pbBadge.style.display = 'inline-flex';
                } else {
                    pbBadge.style.display = 'none';
                }
            }

            // 8. Estado en Vivo / RP / Tarjeta
            updateLiveValues(attempt, discipline);
        }

        function getInitials(name) {
            if (!name) return 'A';
            const parts = name.trim().split(/\s+/);
            if (parts.length === 1) return parts[0].substring(0, 2).toUpperCase();
            return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
        }

        function getCountryIso2(code) {
            if (!code) return '';
            const c = code.trim().toUpperCase();
            if (c.length === 2) return c;
            const map = {
                'ARG': 'ar', 'BRA': 'br', 'CHI': 'cl', 'COL': 'co', 'ESP': 'es', 'SPA': 'es',
                'USA': 'us', 'FRA': 'fr', 'ITA': 'it', 'GER': 'de', 'MEX': 'mx', 'URU': 'uy',
                'ECU': 'ec', 'PER': 'pe', 'VEN': 've', 'BOL': 'bo', 'PAR': 'py', 'CAN': 'ca',
                'JPN': 'jp', 'CHN': 'cn', 'KOR': 'kr', 'AUS': 'au', 'NZL': 'nz', 'GBR': 'gb',
                'UKR': 'ua', 'POL': 'pl', 'RUS': 'ru', 'CRO': 'hr', 'GRE': 'gr', 'TUR': 'tr',
                'HKG': 'hk', 'TWN': 'tw', 'SGP': 'sg', 'RSA': 'za', 'EGY': 'eg', 'CUB': 'cu'
            };
            return map[c] || c.substring(0, 2).toLowerCase();
        }

        // Actualización dinámica de RP, Cronómetro en Vivo y Tarjeta
        function updateLiveValues(attempt, discipline) {
            const nowMs = Date.now() - clockOffset;
            const status = (attempt.attemp_status || '').toLowerCase();
            const disc = (discipline || 'STA').toUpperCase();

            // Tarjeta Oficial
            const cardVal = (attempt.attemp_card || '').toUpperCase();
            const cardContainer = e('focusCard');
            if (cardContainer) {
                if (status === 'finished' && cardVal && cardVal !== 'NONE' && cardVal !== '-') {
                    let cardClass = 'card-white';
                    if (cardVal.includes('YELLOW') || cardVal === 'Y') cardClass = 'card-yellow';
                    else if (cardVal.includes('RED') || cardVal === 'R') cardClass = 'card-red';
                    cardContainer.innerHTML = `<span class="apnea-card ${cardClass}"></span>`;
                    cardContainer.style.display = 'flex';
                } else {
                    cardContainer.innerHTML = '';
                    cardContainer.style.display = 'none';
                }
            }

            // RP / Distancia
            const rpBox = e('focusRpVal');
            if (rpBox) {
                if (status === 'finished' || status === 'completed') {
                    rpBox.innerText = formatMetric(attempt.attemp_rp, disc);
                } else if (status === 'in_progress') {
                    rpBox.innerText = 'EN CURSO';
                } else if (status === 'dns') {
                    rpBox.innerText = 'DNS';
                } else if (status === 'dq') {
                    rpBox.innerText = 'DQ';
                } else {
                    rpBox.innerText = '-';
                }
            }

            // Cronómetro en Vivo
            const timerVal = e('focusTimerVal');
            const timerBox = e('focusTimer');

            if (status === 'in_progress') {
                let startMs = parseTimestampMs(attempt.started_at || attempt.start_time || attempt.start_timestamp);
                const attemptKey = attempt.attemp_id || `lane_${attempt.attemp_lane}`;
                if (startMs === 0) {
                    if (!localAttemptStartMap.has(attemptKey)) {
                        localAttemptStartMap.set(attemptKey, nowMs);
                    }
                    startMs = localAttemptStartMap.get(attemptKey);
                }

                const elapsedSec = Math.max(0, Math.floor((nowMs - startMs) / 1000));
                const mins = Math.floor(elapsedSec / 60);
                const secs = elapsedSec % 60;
                if (timerVal) timerVal.innerText = `${mins}:${String(secs).padStart(2, '0')}`;
                if (timerBox) timerBox.style.display = 'flex';
            } else {
                if (timerBox) timerBox.style.display = 'none';
            }
        }

        // Iniciar Live Ticker (actualización continua a 10 Hz)
        function startLiveTicker() {
            if (liveTickerTimer) clearInterval(liveTickerTimer);
            liveTickerTimer = setInterval(() => {
                const data = getFocusedAthleteData();
                if (data && isOverlayVisible) {
                    updateLiveValues(data.attempt, data.discipline);
                }
            }, 100);
        }

        // Cargar estado inicial desde API
        async function loadInitialData() {
            try {
                const apiBase = getApiBaseUrl();
                const res = await fetch(`${apiBase}/api/all`);
                if (!res.ok) throw new Error(`HTTP Error ${res.status}`);
                const data = await res.json();
                clockOffset = Date.now() - (data.server_now || Date.now());
                appState = data;
                renderFocusedAthlete();
            } catch (err) {
                console.error("Error cargando datos iniciales ATHLETE_FOCUS:", err);
            }
        }

        // Conectar SSE para streaming en vivo
        function setupLiveUpdates() {
            if (eventSource) {
                eventSource.close();
                eventSource = null;
            }
            try {
                const apiBase = getApiBaseUrl();
                eventSource = new EventSource(`${apiBase}/api/events`);

                eventSource.onopen = () => {
                    loadInitialData();
                };

                eventSource.onmessage = async (e) => {
                    if (e.data === 'update' || !e.data || e.data === 'connected') {
                        try {
                            const apiBase = getApiBaseUrl();
                            const res = await fetch(`${apiBase}/api/all`);
                            if (res.ok) {
                                const data = await res.json();
                                clockOffset = Date.now() - (data.server_now || Date.now());
                                appState = data;
                                renderFocusedAthlete();
                            }
                        } catch (err) {
                            console.error("Error procesando evento SSE:", err);
                        }
                    }
                };

                eventSource.onerror = () => {
                    if (eventSource) eventSource.close();
                    eventSource = null;
                    setTimeout(setupLiveUpdates, 3000);
                };
            } catch (err) {
                console.error("Error iniciando SSE:", err);
            }
        }

        // =========================================================
        // CONTROL DE ANIMACIONES (ANIME.JS)
        // =========================================================
        window.play = function() {
            playAnimation();
        };

        window.stop = function() {
            if (window.spxSetState) window.spxSetState('STOPPING');
            runAnimationOUT();
        };

        window.update = function() {
            applyLayoutConfig();
            loadInitialData();
        };

        async function playAnimation() {
            applyLayoutConfig();
            await loadInitialData();

            if (!eventSource) {
                setupLiveUpdates();
            }

            startLiveTicker();
            runAnimationIN();
        }

        // Animación de Entrada: Despliegue suave desde el inferior
        function runAnimationIN() {
            isOverlayVisible = true;
            if (window.spxSetState) window.spxSetState('PLAYING');

            anime.remove('#gfx');
            renderFocusedAthlete();

            anime.set('#gfx', {
                opacity: 0,
                translateY: 25,
                scale: 0.98
            });

            anime({
                targets: '#gfx',
                opacity: [0, 1],
                translateY: [25, 0],
                scale: [0.98, 1],
                duration: 400,
                easing: 'easeOutCubic'
            });
        }

        // Animación de Salida: Desvanecimiento hacia abajo
        function runAnimationOUT() {
            isOverlayVisible = false;
            anime.remove('#gfx');

            anime({
                targets: '#gfx',
                opacity: [1, 0],
                translateY: [0, 20],
                scale: [1, 0.98],
                duration: 250,
                easing: 'easeInCubic',
                complete: function() {
                    anime.set('#gfx', { opacity: 0 });
                    if (window.spxSetState) window.spxSetState('STOPPED');
                }
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            try {
                applyLayoutConfig();
                loadInitialData();
                setupLiveUpdates();
                startLiveTicker();

                if (typeof window !== 'undefined' && window.location && window.location.search) {
                    const urlParams = new URLSearchParams(window.location.search);
                    if (urlParams.has('autostart') || urlParams.has('live') || urlParams.has('show')) {
                        setTimeout(runAnimationIN, 150);
                    }
                }
            } catch (err) {
                console.error("Error en inicialización ATHLETE_FOCUS:", err);
            }
        });

        // =========================================================
        // DEFINICIÓN DE METADATOS SPX (SPXGCTemplateDefinition)
        // =========================================================
        window.SPXGCTemplateDefinition = {
            "description": "Athlete Focus (Single Competitor Lower-Third)",
            "playserver": "OVERLAY",
            "playchannel": "1",
            "playlayer": "3",
            "webplayout": "3",
            "out": "manual",
            "dataformat": "json",
            "uicolor": "2",
            "DataFields": [
                {
                    "ftype": "instruction",
                    "value": "Displays a single competitor lower-third banner with live apnea timer, photo, AP, RP, and official cards."
                },
                {
                    "field": "_LANE_SELECT",
                    "ftype": "dropdown",
                    "title": "Select Competitor / Lane",
                    "value": "auto",
                    "items": [
                        { "text": "Auto (First Active Lane)", "value": "auto" },
                        { "text": "Lane 1", "value": "1" },
                        { "text": "Lane 2", "value": "2" },
                        { "text": "Lane 3", "value": "3" },
                        { "text": "Lane 4", "value": "4" },
                        { "text": "Lane 5", "value": "5" },
                        { "text": "Lane 6", "value": "6" },
                        { "text": "Lane 7", "value": "7" },
                        { "text": "Lane 8", "value": "8" }
                    ]
                },
                {
                    "field": "_POSITION",
                    "ftype": "dropdown",
                    "title": "Screen Position",
                    "value": "pos-bottom-left",
                    "items": [
                        { "text": "Bottom Left (Bottom-Left)", "value": "pos-bottom-left" },
                        { "text": "Bottom Center (Bottom-Center)", "value": "pos-bottom-center" },
                        { "text": "Bottom Right (Bottom-Right)", "value": "pos-bottom-right" },
                        { "text": "Top Left (Top-Left)", "value": "pos-top-left" },
                        { "text": "Center Screen (Center-Center)", "value": "pos-center-center" }
                    ]
                },
                {
                    "field": "_SHOW_PHOTO",
                    "ftype": "dropdown",
                    "title": "Athlete Photo",
                    "value": "true",
                    "items": [
                        { "text": "Show Photo", "value": "true" },
                        { "text": "Hide Photo", "value": "false" }
                    ]
                },
                {
                    "field": "_SHOW_AP",
                    "ftype": "dropdown",
                    "title": "AP Column",
                    "value": "true",
                    "items": [
                        { "text": "Show AP", "value": "true" },
                        { "text": "Hide AP", "value": "false" }
                    ]
                },
                {
                    "field": "_SHOW_TIMER",
                    "ftype": "dropdown",
                    "title": "Live Timer",
                    "value": "true",
                    "items": [
                        { "text": "Show Live Timer", "value": "true" },
                        { "text": "Hide Live Timer", "value": "false" }
                    ]
                },
                {
                    "field": "_SHOW_PB",
                    "ftype": "dropdown",
                    "title": "Personal Best (PB)",
                    "value": "true",
                    "items": [
                        { "text": "Show PB", "value": "true" },
                        { "text": "Hide PB", "value": "false" }
                    ]

</head>
<body>

    <div class="SPXWindow">
        <div id="gfx" class="athlete-focus-panel pos-bottom-left">
            <!-- 1. Andarivel / Lane -->
            <div class="focus-lane" id="focusLane">1</div>

            <!-- 2. Avatar / Foto del Atleta -->
            <div class="focus-avatar-container" id="focusAvatar">
                <span class="focus-avatar-fallback">A</span>
            </div>

            <!-- 3. Bandera y País -->
            <div class="focus-flag" id="focusFlag"></div>
            <div class="focus-country" id="focusCountry"></div>

            <div class="focus-divider"></div>

            <!-- 4. Nombre del Competidor -->
            <div class="focus-name" id="focusName">ATLETA</div>

            <!-- 5. Disciplina -->
            <div class="focus-discipline" id="focusDiscipline">STA</div>

            <!-- 6. AP (Announced Performance) -->
            <div class="focus-stat-box focus-stat-ap">
                <span class="focus-stat-label">AP</span>
                <span class="focus-stat-value" id="focusApVal">-</span>
            </div>

            <!-- 7. Cronómetro en Vivo -->
            <div class="focus-timer-box" id="focusTimer" style="display: none;">
                <span class="focus-timer-pulse"></span>
                <span class="focus-timer-value" id="focusTimerVal">0:00</span>
            </div>

            <!-- 8. RP / Resultado Realizado -->
            <div class="focus-stat-box focus-stat-rp">
                <span class="focus-stat-label">RP</span>
                <span class="focus-stat-value" id="focusRpVal">-</span>
            </div>

            <!-- 9. Tarjeta Oficial -->
            <div class="focus-card-box" id="focusCard" style="display: none;"></div>

            <!-- 10. PB / Récord Personal -->
            <span class="focus-pb-badge" id="focusPb" style="display: none;">PB -</span>
        </div>
    </div>

    <!-- Contenedor Oculto de Datos SPX -->
    <div id="hiddenSpxData">
        <div id="_LANE_SELECT"></div>
        <div id="_POSITION"></div>
        <div id="_SHOW_PHOTO"></div>
        <div id="_SHOW_AP"></div>
        <div id="_SHOW_TIMER"></div>
        <div id="_SHOW_PB"></div>
        <div id="_API_HOST"></div>
        <div id="f99"></div>
    </div>

</body>
</html>
