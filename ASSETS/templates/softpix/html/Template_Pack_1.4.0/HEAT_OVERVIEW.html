<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <title>Apnea - Active Heat Overview</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Scripts Principales -->
    <script type="text/javascript" src="js/lib/anime.min.js"></script>
    <script type="text/javascript" src="js/spx_interface.js"></script>
    <script type="text/javascript" src="js/apnea-helpers.js"></script>
    <script type="text/javascript" src="js/api-client.js"></script>
    
    <!-- Estilos y Tema Dinámico -->
    <link rel="stylesheet" type="text/css" href="css/styles.css" />
    <link rel="stylesheet" type="text/css" href="css/flag-icon.css" />
    <link rel="stylesheet" type="text/css" id="DynamicTheme" href="themes/Apnea_Broadcast.css" />

    <style>
        .SPXWindow {
            position: absolute;
            width: 100vw;
            height: 100vh;
            top: 0;
            left: 0;
            pointer-events: none;
            overflow: hidden;
        }

        #gfx {
            position: absolute;
            opacity: 0; /* Animado por Anime.js */
            box-sizing: border-box;
            z-index: 10;
            display: flex;
            flex-direction: column;
            transform-origin: center center;
            will-change: transform, opacity;
            width: max-content !important;
            max-width: 90vw !important;
            min-width: 0 !important;
        }

        /* Ancho compacto para nombre de atleta (< 18 letras) en Heat Overview */
        #gfx .head-athlete,
        #gfx .apnea-col-athlete {
            width: 12.2vw !important;
            max-width: 12.2vw !important;
            flex: 0 0 12.2vw !important;
        }

        /* Ancho reducido y ajustado para columna de Notas */
        #gfx .head-notes,
        #gfx .apnea-col-notes {
            width: 4.8vw !important;
            max-width: 4.8vw !important;
            flex: 0 0 4.8vw !important;
        }

        /* Ocultar columna AP y restar automáticamente ese espacio del recuadro */
        #gfx.hide-ap .head-ap,
        #gfx.hide-ap .apnea-col-ap {
            display: none !important;
            width: 0 !important;
            max-width: 0 !important;
            padding: 0 !important;
            margin: 0 !important;
            flex: 0 0 0 !important;
        }

        /* Ocultar columna de notas y restar automáticamente ese espacio del recuadro */
        #gfx.hide-notes .head-notes,
        #gfx.hide-notes .apnea-col-notes {
            display: none !important;
            width: 0 !important;
            max-width: 0 !important;
            padding: 0 !important;
            margin: 0 !important;
            flex: 0 0 0 !important;
        }

        /* Alineación vertical perfecta y simétrica en todas las filas */
        .apnea-row,
        .apnea-table-head {
            display: flex !important;
            flex-direction: row !important;
            align-items: center !important;
        }

        .apnea-col-ot,
        .apnea-col-lane,
        .apnea-col-country,
        .apnea-col-athlete,
        .apnea-col-ap,
        .apnea-col-rp,
        .apnea-col-discipline,
        .apnea-col-notes,
        .head-ot,
        .head-lane,
        .head-country,
        .head-athlete,
        .head-ap,
        .head-rp,
        .head-discipline,
        .head-notes {
            display: inline-flex !important;
            align-items: center !important;
            line-height: 1 !important;
        }

        .apnea-col-flag,
        .head-flag,
        .apnea-col-card,
        .head-card {
            display: inline-flex !important;
            align-items: center !important;
            justify-content: center !important;
            line-height: 1 !important;
        }

        .flag-icon {
            display: block !important;
            height: 0.85em !important;
            width: 1.25em !important;
            background-size: cover !important;
            background-position: center center !important;
            border-radius: 2px !important;
            line-height: 1 !important;
            vertical-align: middle !important;
            margin: 0 !important;
        }

        .flag-icon:before {
            content: "" !important;
        }
    </style>

    <script>
        // Helper local seguro para elementos DOM (garantiza compatibilidad durante el escaneo JSDOM de SPX)
        function e(elementID) {
            if (!elementID) return null;
            return document.getElementById(elementID);
        }

        function htmlDecode(txt) {
            if (!txt) return '';
            try {
                var doc = new DOMParser().parseFromString(txt, "text/html");
                return doc.documentElement.textContent || '';
            } catch (_) {
                return txt;
            }
        }

        // Obtener Host de la API (Prioridad: Campo SPX -> Query URL -> Default)
        function getApiBaseUrl() {
            const spxHost = e('_API_HOST') ? e('_API_HOST').innerText.trim() : '';
            if (spxHost !== '') return spxHost.replace(/\/$/, '');
            
            try {
                const urlParams = new URLSearchParams(window.location.search);
                const paramHost = urlParams.get('api') || urlParams.get('host');
                if (paramHost) return paramHost.replace(/\/$/, '');

                if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
                    return `${window.location.protocol}//${window.location.hostname}:3100`;
                }
            } catch (_) {}
            return "https://apnea.glamsi.com";
        }

        // Aplicar Posición y Tamaño al Recuadro desde Configuración SPX
        function applyLayoutConfig() {
            const gfx = e('gfx');
            if (!gfx) return;

            // 1. Posición
            let positionClass = 'pos-bottom-left';
            const spxPos = e('_POSITION') ? e('_POSITION').innerText.trim().toLowerCase() : '';
            let urlPos = '';
            try {
                const urlParams = new URLSearchParams(window.location.search);
                urlPos = (urlParams.get('pos') || urlParams.get('position') || '').toLowerCase();
            } catch (_) {}
            const targetPos = spxPos || urlPos;

            if (targetPos) {
                if (targetPos.includes('center-center') || targetPos === 'pos-center-center') positionClass = 'pos-center-center';
                else if (targetPos.includes('bottom-right')) positionClass = 'pos-bottom-right';
                else if (targetPos.includes('top-left')) positionClass = 'pos-top-left';
                else if (targetPos.includes('top-right')) positionClass = 'pos-top-right';
                else if (targetPos.includes('center-left')) positionClass = 'pos-center-left';
                else if (targetPos.includes('center-right')) positionClass = 'pos-center-right';
                else if (targetPos.includes('bottom-center')) positionClass = 'pos-bottom-center';
                else positionClass = 'pos-bottom-left';
            }

            // 2. Tamaño
            let sizeClass = 'size-standard';
            const spxSize = e('_SIZE') ? e('_SIZE').innerText.trim().toLowerCase() : '';
            let urlSize = '';
            try {
                const urlParams = new URLSearchParams(window.location.search);
                urlSize = (urlParams.get('size') || '').toLowerCase();
            } catch (_) {}
            const targetSize = spxSize || urlSize;

            if (targetSize) {
                if (targetSize.includes('compact')) sizeClass = 'size-compact';
                else if (targetSize.includes('wide')) sizeClass = 'size-wide';
                else if (targetSize.includes('full')) sizeClass = 'size-full';
                else sizeClass = 'size-standard';
            }

            // 3. Show / Hide AP
            const spxAp = e('_SHOW_AP') ? e('_SHOW_AP').innerText.trim().toLowerCase() : '';
            let urlAp = '';
            try {
                const urlParams = new URLSearchParams(window.location.search);
                urlAp = (urlParams.get('ap') || urlParams.get('showap') || '').toLowerCase();
            } catch (_) {}
            const targetAp = spxAp || urlAp;
            const hideApClass = (targetAp === 'false' || targetAp === '0' || targetAp === 'hide' || targetAp === 'no') ? 'hide-ap' : '';

            // 4. Show / Hide Notes
            const spxNotes = e('_SHOW_NOTES') ? e('_SHOW_NOTES').innerText.trim().toLowerCase() : '';
            let urlNotes = '';
            try {
                const urlParams = new URLSearchParams(window.location.search);
                urlNotes = (urlParams.get('notes') || urlParams.get('shownotes') || '').toLowerCase();
            } catch (_) {}
            const targetNotes = spxNotes || urlNotes;
            const hideNotesClass = (targetNotes === 'false' || targetNotes === '0' || targetNotes === 'hide' || targetNotes === 'no') ? 'hide-notes' : '';

            // Resetear clases de posicion, tamaño, ap y notas previas
            gfx.className = `apnea-panel ${positionClass} ${sizeClass} ${hideApClass} ${hideNotesClass}`.replace(/\s+/g, ' ').trim();
        }

        // Formateador inteligente de marcas según disciplina
        function formatMetric(val, discipline) {
            if (!val || val === '' || val === 'undefined' || val === 'null' || val === '-') return '-';
            const strVal = val.toString().trim();
            if (strVal === 'DNS' || strVal === 'DQ' || strVal === 'EN CURSO') return strVal;
            
            const disc = (discipline || '').toUpperCase();
            if (disc === 'STA') {
                if (strVal.includes(':')) {
                    if (strVal.startsWith('0') && strVal.indexOf(':') === 2) {
                        return strVal.substring(1);
                    }
                    return strVal;
                }
                const sec = parseFloat(strVal);
                if (!isNaN(sec)) {
                    const s = Math.max(0, Math.floor(sec));
                    const mins = Math.floor(s / 60);
                    const secs = s % 60;
                    return `${mins}:${String(secs).padStart(2, '0')}`;
                }
                return strVal;
            } else {
                // Disciplinas de distancia DYN / DYNB / DNF: Sin decimales
                const cleaned = strVal.replace(/m$/i, '').trim();
                const num = parseFloat(cleaned);
                if (!isNaN(num)) {
                    return `${Math.round(num)} m`;
                }
                return strVal;
            }
        }

        // =========================================================
        // ESTADO GLOBAL, SINCRONIZACIÓN DE RELOJ Y LIVE ENGINE
        // =========================================================
        let appState = { attempts: [], athletes: [], sessions: [], competition: {}, active_broadcast: {} };
        let clockOffset = 0;
        let liveTickerTimer = null;
        let eventSource = null;
        let isOverlayVisible = false;
        let currentRenderedHeatKey = "";

        // Helper para obtener la duración inicial del Surface Protocol según competencia o federación
        function getCompetitionSpDuration(competition) {
            if (!competition) return 15;
            if (typeof competition.sp_duration === 'number' && competition.sp_duration > 0) return competition.sp_duration;
            if (typeof competition.surface_protocol_duration === 'number' && competition.surface_protocol_duration > 0) return competition.surface_protocol_duration;
            if (typeof competition.sp_seconds === 'number' && competition.sp_seconds > 0) return competition.sp_seconds;
            if (competition.sp_duration && !isNaN(parseInt(competition.sp_duration, 10))) return parseInt(competition.sp_duration, 10);

            const fed = (competition.competition_federation || competition.rules || 'AIDA').trim().toUpperCase();
            if (fed === 'CMAS') return 20;
            return 15;
        }

        // Helper para extraer o recordar el timestamp de finalización (para SP Timer)
        function getAttemptFinishMs(att, nowMs, sessionDate) {
            let rawFinish = att.performance_finished_at || att.finished_at || att.end_time;
            if (!rawFinish && Array.isArray(att.judge_updates)) {
                const finishEv = att.judge_updates.slice().reverse().find(u => 
                    ['PRESTOP', 'STOP', 'FINAL', 'SURFACE', 'DONE'].includes((u.event_type || u.type || '').toUpperCase())
                );
                if (finishEv) rawFinish = finishEv.timestamp || finishEv.time;
            }

            let finishMs = parseTimestampMs(rawFinish, sessionDate);
            const key = att.attemp_id || `lane_${att.attemp_lane || 1}`;
            if (finishMs === 0) {
                if (!localAttemptFinishMap.has(key)) {
                    localAttemptFinishMap.set(key, nowMs);
                }
                finishMs = localAttemptFinishMap.get(key);
            }
            return finishMs;
        }

        // Cargar estado inicial y calcular offset del reloj con el servidor
        async function loadInitialData() {
            try {
                const apiBase = getApiBaseUrl();
                const res = await fetch(`${apiBase}/api/all`);
                if (!res.ok) throw new Error(`HTTP Error ${res.status}`);
                const data = await res.json();

                // Guardar offset entre el reloj local y el servidor para evitar desfases
                clockOffset = Date.now() - (data.server_now || Date.now());
                appState = data;

                syncHeatStructure();
            } catch (err) {
                console.error("Error al cargar datos iniciales:", err);
            }
        }

        // Escuchar cambios de eventos vía SSE (START, LAP, PRESTOP, etc.)
        function setupLiveUpdates() {
            if (eventSource) {
                eventSource.close();
                eventSource = null;
            }
            try {
                const apiBase = getApiBaseUrl();
                eventSource = new EventSource(`${apiBase}/api/events`);

                eventSource.onopen = () => {
                    console.log("SSE conectado a:", `${apiBase}/api/events`);
                    loadInitialData();
                };

                eventSource.onmessage = async (e) => {
                    if (e.data === 'update' || !e.data || e.data === 'connected') {
                        try {
                            const apiBase = getApiBaseUrl();
                            const res = await fetch(`${apiBase}/api/all`);
                            if (res.ok) {
                                const data = await res.json();
                                clockOffset = Date.now() - (data.server_now || Date.now());
                                appState = data;
                                syncHeatStructure();
                            }
                        } catch (err) {
                            console.error("Error actualizando estado por SSE:", err);
                        }
                    }
                };

                eventSource.onerror = () => {
                    console.warn("SSE reconectando...");
                };
            } catch (e) {
                console.error("Error al inicializar EventSource:", e);
            }
        }

        // Obtener la información del heat activo a partir del estado global
        function getActiveHeatInfo() {
            if (!appState || !appState.sessions || !appState.attempts) return null;

            const activeBroadcast = appState.active_broadcast || {};
            let activeSessionId = activeBroadcast.session_id || "";
            let activeOt = activeBroadcast.session_ot || activeBroadcast.heat_ot || "";

            const sessionsList = appState.sessions || appState.heats || [];
            let activeSession = sessionsList.find(s => (s.session_id === activeSessionId || s.heat_id === activeSessionId));

            if (!activeSession && sessionsList.length > 0) {
                activeSession = sessionsList.find(s => s.status !== 'closed') || sessionsList[0];
                activeSessionId = activeSession.session_id || activeSession.heat_id;
            }

            if (!activeSession) return null;

            const sessionAttempts = (appState.attempts || []).filter(att => 
                att.session_id === activeSessionId || att.heat_id === activeSessionId
            );

            if (!activeOt) {
                const performingAtt = sessionAttempts.find(att => att.attemp_status === 'PERFORMING');
                if (performingAtt && performingAtt.attemp_ot) {
                    activeOt = performingAtt.attemp_ot;
                } else if (sessionAttempts.length > 0) {
                    activeOt = sessionAttempts[0].attemp_ot || "";
                }
            }

            let heatAttempts = sessionAttempts.filter(att => !activeOt || att.attemp_ot === activeOt);
            if (heatAttempts.length === 0 && sessionAttempts.length > 0) {
                heatAttempts = sessionAttempts.slice(0, activeSession.lanes_count || 4);
            }

            heatAttempts.sort((a, b) => parseInt(a.attemp_lane || 0, 10) - parseInt(b.attemp_lane || 0, 10));

            return {
                session: activeSession,
                sessionId: activeSessionId,
                ot: activeOt,
                discipline: (activeSession.session_discipline || "STA").toUpperCase(),
                attempts: heatAttempts
            };
        }

        // Nota: Funciones auxiliares (extractAttemptNotes, getAttemptCardAndNotes, formatMetric, etc.)
        // son provistas de manera centralizada por js/apnea-helpers.js

        // Sincronizar la estructura DOM del Heat (solo regenera HTML si cambia de sesión / heat)
        function syncHeatStructure() {
            const heatInfo = getActiveHeatInfo();
            if (!heatInfo) return;

            const athletesList = appState.athletes || [];
            const heatKey = `${heatInfo.sessionId}_${heatInfo.ot}_${heatInfo.attempts.map(a => a.athlete_id + '_' + a.attemp_lane).join('-')}`;

            // Actualizar Encabezados
            if (e('heatDiscipline')) e('heatDiscipline').innerText = heatInfo.discipline;
            if (e('heatTitle')) e('heatTitle').innerText = 'HEAT EN VIVO';
            if (e('heatOt')) {
                if (heatInfo.ot) {
                    e('heatOt').innerText = `OT ${heatInfo.ot}`;
                    e('heatOt').style.display = 'inline-flex';
                } else {
                    e('heatOt').style.display = 'none';
                }
            }
            if (e('sessionName')) e('sessionName').innerText = heatInfo.session.session_name || 'SESIÓN ACTIVA';

            // Regenerar estructura de filas solo si cambió de heat o es primera vez
            if (heatKey !== currentRenderedHeatKey) {
                currentRenderedHeatKey = heatKey;
                const container = e('lanesContainer');
                if (!container) return;

                if (heatInfo.attempts.length === 0) {
                    container.innerHTML = `<div class="empty-heat-msg">No hay intentos programados para este heat</div>`;
                    return;
                }

                let html = '';
                heatInfo.attempts.forEach(att => {
                    const athlete = athletesList.find(a => a.athlete_id === att.athlete_id) || {};
                    const lane = att.attemp_lane || 1;
                    const country = (athlete.athlete_country || '').toUpperCase();
                    const flagClass = country ? `flag-icon flag-icon-${country.toLowerCase()}` : '';

                    const isJudged = att.attemp_status === 'JUDGED' || att.attemp_status === 'DQ' || Boolean(att.attemp_card) || att.attemp_status === 'DNS';
                    const cardInfo = getAttemptCardAndNotes(att, isJudged, Date.now() - clockOffset, appState.competition, clockOffset);

                    html += `
                    <div class="apnea-row" id="lane-row-${lane}">
                        <div class="apnea-col-lane">${lane}</div>
                        <div class="apnea-col-flag">
                            <span class="${flagClass}" title="${country}"></span>
                        </div>
                        <div class="apnea-col-country">${country}</div>
                        <div class="apnea-col-athlete">${htmlDecode(athlete.athlete_name || 'ATLETA')}</div>
                        <div class="apnea-col-ap">${htmlDecode(formatMetric(att.attemp_ap, heatInfo.discipline))}</div>
                        <div class="apnea-col-rp" id="live-rp-${lane}">-</div>
                        <div class="apnea-col-card">
                            <span class="card-indicator ${cardInfo.cardClass}" id="card-lane-${lane}"></span>
                        </div>
                        <div class="apnea-col-notes" id="notes-lane-${lane}">${cardInfo.noteHtml}</div>
                    </div>`;
                });

                container.innerHTML = html;
            }

            // Ejecutar tick inmediato para reflejar valores
            tickLiveValues();
        }

        // Ticker continuo cada 200ms para proyección fluida segundo a segundo
        function tickLiveValues() {
            const heatInfo = getActiveHeatInfo();
            if (!heatInfo) return;

            const nowMs = Date.now() - clockOffset;
            const athletesList = appState.athletes || [];
            const isDynamic = ['DYN', 'DYNB', 'DNF'].includes(heatInfo.discipline);

            heatInfo.attempts.forEach(att => {
                const lane = att.attemp_lane || 1;
                const rowEl = e(`lane-row-${lane}`);
                const rpEl = e(`live-rp-${lane}`);
                const cardEl = e(`card-lane-${lane}`);
                const notesEl = e(`notes-lane-${lane}`);
                if (!rpEl) return;

                const attemptKey = att.attemp_id || `lane_${lane}`;
                const card = (att.attemp_card || '').toLowerCase();
                const status = (att.attemp_status || '').toUpperCase();
                const isJudged = status === 'JUDGED' || status === 'DQ' || status === 'DNS' || (card && card !== 'none' && card !== 'card-none');
                const isPerforming = status === 'PERFORMING';
                const updates = Array.isArray(att.judge_updates) ? att.judge_updates : [];

                // Para DQ/DNS no se necesita resultado numérico → mostrar inmediatamente.
                // Para tarjeta blanca/amarilla, esperar a que official_result o attemp_rp
                // estén disponibles antes de mostrar la tarjeta+RP+notes en simultáneo.
                // Así se evita el flash de "tarjeta sin RP" cuando el servidor escribe en dos pasos.
                const isDqOrDns = card === 'red' || status === 'DQ' || card === 'dns' || status === 'DNS';
                const hasNumericResult = Boolean(att.official_result || att.attemp_rp);
                const isReadyToDisplay = isJudged && (isDqOrDns || hasNumericResult);

                // Señales de inicio que vienen del servidor
                const serverSignalsStart = isPerforming || status === 'DONE' ||
                                           Boolean(att.performance_started_at || att.started_at || att.performance_finished_at) ||
                                           updates.some(u => ['START', 'LAP', 'PRESTOP', 'STOP', 'FINAL', 'SURFACE', 'DONE'].includes((u.event_type || u.type || '').toUpperCase()));

                // Si el servidor no reporta ninguna señal de inicio (intento reseteado),
                // limpiar los maps locales para que hasStarted vuelva a false
                if (!serverSignalsStart && !isJudged) {
                    localAttemptStartMap.delete(attemptKey);
                    localAttemptFinishMap.delete(attemptKey);
                    liveTrackers.delete(attemptKey);
                }

                const hasStarted = serverSignalsStart ||
                                   localAttemptStartMap.has(attemptKey) || localAttemptFinishMap.has(attemptKey);

                const hasFinishedPerformance = status === 'DONE' ||
                                               Boolean(att.performance_finished_at) ||
                                               updates.some(u => ['PRESTOP', 'STOP', 'FINAL', 'SURFACE', 'DONE'].includes((u.event_type || u.type || '').toUpperCase())) ||
                                               localAttemptFinishMap.has(attemptKey);

                const cardInfo = getAttemptCardAndNotes(att, isReadyToDisplay, nowMs, appState.competition, clockOffset, appState.session_date);

                // Actualizar estado de fila
                if (rowEl) {
                    if (hasStarted && !isReadyToDisplay) rowEl.classList.add('is-performing');
                    else rowEl.classList.remove('is-performing');
                }

                // Tarjeta y Notes: solo mostrar cuando el resultado también está listo
                if (cardEl) {
                    cardEl.className = `card-indicator ${isReadyToDisplay ? cardInfo.cardClass : 'card-none'}`;
                    cardEl.innerHTML = '';
                }

                if (notesEl) {
                    notesEl.innerHTML = isReadyToDisplay ? cardInfo.noteHtml : (hasStarted ? cardInfo.noteHtml : '');
                }

                if (isReadyToDisplay) {
                    localAttemptStartMap.delete(attemptKey);
                    localAttemptFinishMap.delete(attemptKey);
                    liveTrackers.delete(attemptKey);

                    rpEl.classList.remove('is-live');
                    let resultDisplay = '';
                    if (card === 'red' || status === 'DQ') {
                        resultDisplay = 'DQ';
                    } else if (card === 'dns' || status === 'DNS') {
                        resultDisplay = 'DNS';
                    } else {
                        const val = att.official_result || att.attemp_rp || '-';
                        resultDisplay = formatMetric(val, heatInfo.discipline);
                    }
                    rpEl.innerHTML = htmlDecode(resultDisplay);
                } else if (hasStarted) {
                    rpEl.classList.add('is-live');
                    if (isDynamic) {
                        const athlete = athletesList.find(a => a.athlete_id === att.athlete_id) || {};
                        const attemptForCalc = {
                            ...att,
                            athlete_gender: athlete.athlete_gender || att.athlete_gender || 'M',
                            attemp_discipline: heatInfo.discipline
                        };
                        const calcTime = hasFinishedPerformance ? getAttemptFinishMs(att, nowMs, appState.session_date) : nowMs;
                        const estimatedMeters = calculateLiveDynamicDistance(
                            attemptForCalc,
                            appState.competition,
                            calcTime,
                            !hasFinishedPerformance
                        );
                        rpEl.innerHTML = `${estimatedMeters} m`;
                    } else {
                        // STA: Cálculo horario local continuo y estable
                        let rawStartTime = att.started_at || att.start_time || att.performance_started_at || att.timestamp;
                        if (!rawStartTime && Array.isArray(att.judge_updates)) {
                            const startEv = att.judge_updates.find(u => (u.event_type || u.type || '').toUpperCase() === 'START');
                            if (startEv) rawStartTime = startEv.timestamp || startEv.time || startEv.created_at;
                        }

                        let parsedStartMs = parseTimestampMs(rawStartTime, appState.session_date);
                        if (parsedStartMs > 0) {
                            if (!localAttemptStartMap.has(attemptKey) || Math.abs(localAttemptStartMap.get(attemptKey) - parsedStartMs) > 1500) {
                                localAttemptStartMap.set(attemptKey, parsedStartMs);
                            }
                        } else if (!localAttemptStartMap.has(attemptKey)) {
                            localAttemptStartMap.set(attemptKey, nowMs);
                        }

                        const startMs = localAttemptStartMap.get(attemptKey);
                        const endMs = hasFinishedPerformance ? getAttemptFinishMs(att, nowMs, appState.session_date) : nowMs;
                        const elapsedSec = Math.max(0, (endMs - startMs) / 1000);
                        const mins = Math.floor(elapsedSec / 60);
                        const secs = Math.floor(elapsedSec % 60);
                        rpEl.innerHTML = `${mins}:${String(secs).padStart(2, '0')}`;
                    }
                } else {
                    localAttemptStartMap.delete(attemptKey);
                    localAttemptFinishMap.delete(attemptKey);
                    liveTrackers.delete(attemptKey);

                    rpEl.classList.remove('is-live');
                    rpEl.innerHTML = htmlDecode(formatMetric(att.preliminary_result || att.attemp_rp || '-', heatInfo.discipline));
                }
            });
        }

        // Iniciar Ticker Continuo
        function startLiveTicker() {
            if (liveTickerTimer) clearInterval(liveTickerTimer);
            liveTickerTimer = setInterval(() => {
                if (isOverlayVisible) {
                    tickLiveValues();
                }
            }, 200); // 200ms para fluidez continua sin saltos
        }

        function stopLiveTicker() {
            if (liveTickerTimer) {
                clearInterval(liveTickerTimer);
                liveTickerTimer = null;
            }
        }

        // =========================================================
        // HANDLERS DEL CICLO DE VIDA DE SPX
        // =========================================================

        function runTemplateUpdate() {
            // Resetear toggle de columnas al disparar un nuevo Play
            _toggleColumnsExpanded = false;

            // Actualizar tema visual si está configurado en f99
            if (e('DynamicTheme') && e('f99') && e('f99').innerText.trim() !== '') {
                e('DynamicTheme').href = e('f99').innerText.trim();
            }

            // Aplicar configuración de posición y tamaño
            applyLayoutConfig();

            // Asegurar conexión y ticker activos
            if (!eventSource) {
                setupLiveUpdates();
            }
            startLiveTicker();

            // Ejecutar animación de entrada inmediatamente sin retrasos
            runAnimationIN();
        }

        function runAnimationIN() {
            isOverlayVisible = true;

            // Detener cualquier animación previa
            anime.remove(['#gfx', '.apnea-header', '.apnea-row', '.apnea-footer']);

            // Reset inicial rápido
            anime.set('#gfx', { opacity: 0, scale: 0.96 });
            anime.set('.apnea-header', { opacity: 0, translateY: -15 });
            anime.set('.apnea-row', { opacity: 0, translateX: -20 });
            anime.set('.apnea-footer', { opacity: 0, translateY: 10 });

            // Timeline principal de entrada con Anime.js (rápido y fluido: 320ms)
            var tl = anime.timeline({
                easing: 'easeOutCubic'
            });

            tl.add({
                targets: '#gfx',
                opacity: [0, 1],
                scale: [0.96, 1],
                duration: 250
            }, 0)
            .add({
                targets: '.apnea-header',
                opacity: [0, 1],
                translateY: [-15, 0],
                duration: 250
            }, 40)
            .add({
                targets: '.apnea-row',
                opacity: [0, 1],
                translateX: [-20, 0],
                duration: 260,
                delay: anime.stagger(35)
            }, 80)
            .add({
                targets: '.apnea-footer',
                opacity: [0, 1],
                translateY: [10, 0],
                duration: 200
            }, 120);
        }

        function runAnimationOUT() {
            isOverlayVisible = false;

            // Detener cualquier animación previa
            anime.remove(['#gfx', '.apnea-header', '.apnea-row', '.apnea-footer']);

            // Salida inmediata y limpia (200ms total)
            var tl = anime.timeline({
                easing: 'easeInCubic',
                duration: 200,
                complete: function() {
                    anime.set('#gfx', { opacity: 0, scale: 0.96 });
                }
            });

            tl.add({
                targets: ['.apnea-footer', '.apnea-row', '.apnea-header'],
                opacity: [1, 0],
                duration: 150
            }, 0)
            .add({
                targets: '#gfx',
                opacity: [1, 0],
                scale: [1, 0.96],
                duration: 200
            }, 40);
        }

        // =========================================================
        // CONTINUE: Toggle de columnas AP y Notes
        // Si alguna estaba oculta, las muestra ambas.
        // Si estaban ambas visibles, restaura el estado SPX original.
        // =========================================================
        let _toggleColumnsExpanded = false;

        function runAnimationNEXT() {
            const gfx = e('gfx');
            if (!gfx) return;

            // Determinar estado original desde configuración SPX
            const spxAp = e('_SHOW_AP') ? e('_SHOW_AP').innerText.trim().toLowerCase() : 'true';
            const spxNotes = e('_SHOW_NOTES') ? e('_SHOW_NOTES').innerText.trim().toLowerCase() : 'true';
            const originallyHideAp = (spxAp === 'false' || spxAp === '0' || spxAp === 'hide' || spxAp === 'no');
            const originallyHideNotes = (spxNotes === 'false' || spxNotes === '0' || spxNotes === 'hide' || spxNotes === 'no');

            // Solo tiene sentido el toggle si había algo oculto originalmente
            if (!originallyHideAp && !originallyHideNotes) return;

            _toggleColumnsExpanded = !_toggleColumnsExpanded;

            // Animación rápida de fade out de columnas afectadas, cambio de visibilidad, fade in
            const affectedCols = [];
            if (originallyHideAp) affectedCols.push('.apnea-col-ap', '.head-ap');
            if (originallyHideNotes) affectedCols.push('.apnea-col-notes', '.head-notes');

            if (_toggleColumnsExpanded) {
                // Mostrar columnas ocultas: quitar hide-ap y/o hide-notes
                gfx.classList.remove('hide-ap', 'hide-notes');
                anime({
                    targets: affectedCols,
                    opacity: [0, 1],
                    duration: 280,
                    easing: 'easeOutQuad'
                });
            } else {
                // Restaurar estado original
                anime({
                    targets: affectedCols,
                    opacity: [1, 0],
                    duration: 200,
                    easing: 'easeInQuad',
                    complete: function() {
                        if (originallyHideAp) gfx.classList.add('hide-ap');
                        if (originallyHideNotes) gfx.classList.add('hide-notes');
                        anime({
                            targets: affectedCols,
                            opacity: 1,
                            duration: 1
                        });
                    }
                });
            }
        }

        // Inicialización y precarga inmediata en background
        window.addEventListener('DOMContentLoaded', () => {
            try {
                applyLayoutConfig();
                loadInitialData();
                setupLiveUpdates();
                startLiveTicker();

                if (typeof window !== 'undefined' && window.location && window.location.search) {
                    const urlParams = new URLSearchParams(window.location.search);
                    if (urlParams.has('autostart') || urlParams.has('live') || urlParams.has('show')) {
                        setTimeout(runAnimationIN, 100);
                    }
                }
            } catch (err) {
                console.error("Error en inicialización:", err);
            }
        });

        // =========================================================
        // DEFINICIÓN DE METADATOS SPX (SPXGCTemplateDefinition)
        // =========================================================
        window.SPXGCTemplateDefinition = {
            "description": "Active Heat Overview (Live SSE) — Continue: toggle AP/Notes",
            "playserver": "OVERLAY",
            "playchannel": "1",
            "playlayer": "3",
            "webplayout": "3",
            "out": "manual",
            "steps": 99,
            "dataformat": "json",
            "uicolor": "3",
            "DataFields": [
                {
                    "ftype": "instruction",
                    "value": "Play → muestra el heat. Continue → revela/oculta las columnas AP y Notes que estén ocultas en la configuración."
                },
                {
                    "field": "_POSITION",
                    "ftype": "dropdown",
                    "title": "Screen Position",
                    "value": "pos-bottom-left",
                    "items": [
                        { "text": "Center Screen (Center-Center)", "value": "pos-center-center" },
                        { "text": "Bottom Left (Bottom-Left)", "value": "pos-bottom-left" },
                        { "text": "Bottom Right (Bottom-Right)", "value": "pos-bottom-right" },
                        { "text": "Top Left (Top-Left)", "value": "pos-top-left" },
                        { "text": "Top Right (Top-Right)", "value": "pos-top-right" },
                        { "text": "Center Left (Center-Left)", "value": "pos-center-left" },
                        { "text": "Center Right (Center-Right)", "value": "pos-center-right" },
                        { "text": "Bottom Center (Bottom-Center)", "value": "pos-bottom-center" }
                    ]
                },
                {
                    "field": "_SIZE",
                    "ftype": "dropdown",
                    "title": "Panel Size",
                    "value": "size-standard",
                    "items": [
                        { "text": "Compact (40% width)", "value": "size-compact" },
                        { "text": "Standard (50% width)", "value": "size-standard" },
                        { "text": "Wide (62% width)", "value": "size-wide" },
                        { "text": "Full (75% width)", "value": "size-full" }
                    ]
                },
                {
                    "field": "_SHOW_AP",
                    "ftype": "dropdown",
                    "title": "AP Column",
                    "value": "true",
                    "items": [
                        { "text": "Show AP", "value": "true" },
                        { "text": "Hide AP", "value": "false" }
                    ]
                },
                {
                    "field": "_SHOW_NOTES",
                    "ftype": "dropdown",
                    "title": "Notes Column",
                    "value": "true",
                    "items": [
                        { "text": "Show Notes", "value": "true" },
                        { "text": "Hide Notes", "value": "false" }
                    ]
                },
                {
                    "field": "f99",
                    "ftype": "filelist",
                    "title": "Visual Theme",
                    "assetfolder": "./themes/",
                    "extension": "css",
                    "value": "./themes/Apnea_Broadcast.css"
                },
                {
                    "field": "_API_HOST",
                    "ftype": "textfield",
                    "title": "API Host URL (Optional)",
                    "value": ""
                }
            ]
        };
    </script>
</head>
<body>

    <div class="SPXWindow">
        <div id="gfx" class="apnea-panel pos-bottom-left size-standard">
            <!-- Encabezado del Heat -->
            <div class="apnea-header">
                <div class="apnea-header-title">
                    <span id="sessionName"></span>
                </div>
                <div class="apnea-header-sub">
                    <span class="apnea-badge ot" id="heatOt"></span>
                </div>
            </div>

            <!-- Encabezado de Columnas -->
            <div class="apnea-table-head">
                <div class="head-lane"></div>
                <div class="head-flag"></div>
                <div class="head-country"></div>
                <div class="head-athlete"></div>
                <div class="head-ap">AP</div>
                <div class="head-rp">RP</div>
                <div class="head-card"></div>
				<div class="head-notes"></div>
            </div>

            <!-- Lista de Carriles / Participantes -->
            <div id="lanesContainer">
                <div class="empty-heat-msg">Conectando con el servidor de competencia...</div>
            </div>

            <!-- Pie de Panel / Footer -->
            <div class="apnea-footer">
                <span class="footer-dot"></span>
                <span class="footer-text">preliminary results</span>
            </div>
        </div>
    </div>

    <!-- Contenedor Oculto de Datos SPX -->
    <div id="hiddenSpxData">
        <div id="_POSITION"></div>
        <div id="_SIZE"></div>
        <div id="_SHOW_AP"></div>
        <div id="_SHOW_NOTES"></div>
        <div id="_API_HOST"></div>
        <div id="f99"></div>
    </div>

</body>
</html>
